name: app-release
on:
  push:
    tags: ["v*"]
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: pip install -r tools/requirements.txt
      - run: python -m tools.pack build --release && python -m tools.pack bundle
      - uses: subosito/flutter-action@v2
        with: {flutter-version: "3.47.7", channel: stable, cache: true}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "21"}
      - name: Upload key
        run: |
          echo "${{ secrets.UPLOAD_KEYSTORE_BASE64 }}" | base64 -d > apps/mobile/android/upload.jks
          cat > apps/mobile/android/key.properties <<PROPS
          storeFile=../upload.jks
          storePassword=${{ secrets.UPLOAD_STORE_PASSWORD }}
          keyAlias=${{ secrets.UPLOAD_KEY_ALIAS }}
          keyPassword=${{ secrets.UPLOAD_KEY_PASSWORD }}
          PROPS
      - run: flutter pub get && cd apps/mobile && flutter gen-l10n
      - run: >
          cd apps/mobile && flutter build appbundle --release
          --dart-define=APP_VERSION=${GITHUB_REF_NAME#v}
          --dart-define=CONTENT_BASE_URL=${{ vars.CONTENT_BASE_URL }}
      # 16 KB page size: every native library must be 16 KB aligned (plan §6.12).
      - run: tools/check_16kb.sh apps/mobile/build/app/outputs/bundle/release/app-release.aab
      - uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: in.ganitaveda.app
          releaseFiles: apps/mobile/build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: draft
