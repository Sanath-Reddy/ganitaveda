name: app-check
on:
  pull_request:
    paths: ["apps/**", "packages/**", "content/**", "tools/**"]
  push:
    branches: [main]
jobs:
  app:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13", cache: pip, cache-dependency-path: tools/requirements.txt}
      - run: pip install -r tools/requirements.txt
      - run: python -m tools.pack build && python -m tools.pack bundle
      - uses: subosito/flutter-action@v2
        with: {flutter-version: "3.47.7", channel: stable, cache: true}
      - run: flutter pub get
      - run: cd apps/mobile && flutter gen-l10n
      # Release builds block any missing Kannada interface string (plan §6.11).
      - run: test "$(cat apps/mobile/build/untranslated.json 2>/dev/null || echo '{}')" = "{}"
      # lib/l10n is generated by gen-l10n; everything a person writes is checked.
      - run: dart format --output=none --set-exit-if-changed -l 120 apps/mobile/lib/app apps/mobile/lib/features apps/mobile/lib/shared apps/mobile/lib/main.dart apps/mobile/test apps/mobile/integration_test packages
      - run: cd packages/ganita_core && dart analyze --fatal-infos && dart test
      - run: cd packages/content_model && dart analyze --fatal-infos && dart test
      - run: cd packages/design_system && flutter analyze && flutter test
      - run: cd apps/mobile && flutter analyze && flutter test
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "21"}
      - run: cd apps/mobile && flutter build apk --debug --dart-define=APP_VERSION=$(grep '^version:' pubspec.yaml | cut -d' ' -f2 | cut -d+ -f1)
