note: Root verses of the Gaṇitapāda (Shukla 1976 numbering), picked out of Bhāskara I's commentary. Each line is copied exactly from the e-text and must occur exactly once in it unless allow_repeat is set. All 33 verses are now located; the Sanskrit reviewer confirms every pick.
