- id: verse.bss.18.1
  section: section.bss.18
  ordinal: 67
  ref_label: '18.1'
  devanagari: 'प्रायेण यतस् प्रश्नास् कुट्टाकारात् ऋते न शक्यन्ते ।

    ज्ञातुम् वक्ष्यामि ततस् कुट्टाकारम् सह प्रश्नैस् ॥'
  source_text: 'prāyeṇa yatas praśnās kuṭṭākārāt ṛte na śakyante/

    jñātum vakṣyāmi tatas kuṭṭākāram saha praśnais// BSS_18.1'
  source: source.gretil-bss
  review: unreviewed
- id: verse.bss.18.2
  section: section.bss.18
  ordinal: 68
  ref_label: '18.2'
  devanagari: 'कुट्टक-ख-ऋण-धन-अव्यक्त-मध्य-हरण-एक-वर्ण-भावितकैस् ।

    आचार्यस् तन्त्र-विदाम् ज्ञातैस् वर्ग-प्रकृत्या च ॥'
  source_text: 'kuṭṭaka-#kha-ṛṇa-dhana-avyakta-madhya-haraṇa-%eka-varṇa-bhāvitakais/

    ācāryas tantra-vidām jñātais varga-prakṛtyā ca// BSS_18.2'
  source: source.gretil-bss
  review: unreviewed
- id: verse.bss.18.3
  section: section.bss.18
  ordinal: 69
  ref_label: '18.3'
  devanagari: 'अधिक-अग्र-भाग-हारात् ऊन-अग्र-छेद-भाजितात् शेषम् ।

    यत् तत् परस्पर-हृतम् लब्धम् अधस् अधस् पृथक् स्थाप्यम् ॥'
  source_text: 'adhika-agra-bhāga-hārāt ūna-agra-cheda-bhājitāt śeṣam/

    yat tat paraspara-hṛtam labdham adhas adhas pṛthak sthāpyam// BSS_18.3'
  source: source.gretil-bss
  review: unreviewed
- id: verse.bss.18.4
  section: section.bss.18
  ordinal: 70
  ref_label: '18.4'
  devanagari: 'शेषम् तथा इष्ट-गुणितम् यथा अग्रयोस् अन्तरेण संयुक्तम् ।

    शुध्यति गुणकस् स्थाप्यस् लब्धम् च अन्त्यात् उपान्त्य-गुणस् ॥'
  source_text: 'śeṣam tathā iṣṭa-guṇitam yathā agrayos antareṇa saṃyuktam/

    śudhyati guṇakas sthāpyas labdham ca antyāt upāntya-guṇas// BSS_18.4'
  source: source.gretil-bss
  review: unreviewed
- id: verse.bss.18.5
  section: section.bss.18
  ordinal: 71
  ref_label: '18.5'
  devanagari: 'स्व-ऊर्ध्वस् अन्त्य-युतस् अग्र-अन्तस् हीन-अग्र-छेद-भाजितस् शेषम् ।

    अधिक-अग्र-छेद-हतम् अधिक-अग्र-युतम् भवति अग्रम् ॥'
  source_text: 'sva-ūrdhvas antya-yutas agra-antas hīna-agra-cheda-bhājitas śeṣam/

    adhika-agra-cheda-hatam adhika-agra-yutam bhavati agram// BSS_18.5'
  source: source.gretil-bss
  review: unreviewed
- id: verse.bss.18.6
  section: section.bss.18
  ordinal: 72
  ref_label: '18.6'
  devanagari: 'छेद-वधस्य द्वि-युगम् छेद-वधस् युग-गतम् द्वयोस् अग्रम् ।

    कुट्टाकारेण एवम् त्रि-आदि-ग्रह-युग-गत-आनयनम् ॥'
  source_text: 'cheda-vadhasya %dvi-yugam cheda-vadhas yuga-gatam %dvayos agram/

    kuṭṭākāreṇa evam %tri-ādi-graha-yuga-gata-ānayanam// BSS_18.6'
  source: source.gretil-bss
  review: unreviewed
- id: verse.bss.18.7
  section: section.bss.18
  ordinal: 73
  ref_label: '18.7'
  devanagari: 'भ-गण-आदि-शेषम् अग्रम् छेद-हृतम् खम् च दिन-ज-शेष-हृतम् ।

    अनयोस् अग्रम् भ-गण-आदि-दिन-ज-शेष-उद्धृतम् द्यु-गणस् ॥'
  source_text: 'bha-gaṇa-ādi-śeṣam agram cheda-hṛtam #kham ca dina-ja-śeṣa-hṛtam/

    anayos agram bha-gaṇa-ādi-dina-ja-śeṣa-uddhṛtam dyu-gaṇas//  BSS_18.7'
  source: source.gretil-bss
  review: unreviewed
- id: verse.bss.18.8
  section: section.bss.18
  ordinal: 74
  ref_label: '18.8'
  devanagari: 'दिन-ज-भ-गण-आदि-शेषम् येन गुणम् मण्डल-आदि शेषकयोस् ।

    स-दृश-छेद-उद्धृतयोस् तद्-घातम् अहर्-गण-आद्यम् अतस् ॥'
  source_text: 'dina-ja-bha-gaṇa-ādi-śeṣam yena guṇam maṇḍala-ādi śeṣakayos/

    sa-dṛśa-cheda-uddhṛtayos tad-ghātam ahar-gaṇa-ādyam atas//  BSS_18.8'
  source: source.gretil-bss
  review: unreviewed
- id: verse.bss.18.9
  section: section.bss.18
  ordinal: 75
  ref_label: '18.9'
  devanagari: 'हृतयोस् परस्परम् यत् छेषम् गुण-कार-भाग-हारकयोस् ।

    तेन हृतौ निस्-छेदौ तौ एव परस्परम् हृतयोस् ॥'
  source_text: 'hṛtayos parasparam yat cheṣam guṇa-kāra-bhāga-hārakayos/

    tena hṛtau nis-chedau tau eva parasparam hṛtayos//  BSS_18.9'
  source: source.gretil-bss
  review: unreviewed
- id: verse.bss.18.10
  section: section.bss.18
  ordinal: 76
  ref_label: '18.10'
  devanagari: 'लब्धम् अधस् अधस् स्थाप्यम् तथा इष्ट-गुण-कार-सङ्गुणम् शेषम् ।

    शुध्यति यथा एक-हीनम् गुणकस् स्थाप्यस् फलम् च अन्त्यात् ॥'
  source_text: 'labdham adhas adhas sthāpyam tathā iṣṭa-guṇa-kāra-saṅguṇam śeṣam/

    śudhyati yathā %eka-hīnam guṇakas sthāpyas phalam ca antyāt//  BSS_18.10'
  source: source.gretil-bss
  review: unreviewed
- id: verse.bss.18.11
  section: section.bss.18
  ordinal: 77
  ref_label: '18.11'
  devanagari: 'अग्र-अन्तम् उपान्त्येन स्व-ऊर्ध्वस् गुणितस् अन्त्य-संयुतस् भक्तम् ।

    निस्-शेष-भाग-हारेण एवम् स्थिर-कुट्टकस् शेषम् ॥'
  source_text: 'agra-antam upāntyena sva-ūrdhvas guṇitas antya-saṃyutas bhaktam/

    nis-śeṣa-bhāga-hāreṇa evam sthira-kuṭṭakas śeṣam//  BSS_18.11'
  source: source.gretil-bss
  review: unreviewed
- id: verse.bss.18.12
  section: section.bss.18
  ordinal: 78
  ref_label: '18.12'
  devanagari: 'इष्ट-भ-गण-आदि-शेषात् स्व-कुट्टक-गुणात् स्व-भाग-हार-गुणात् ।

    शेषम् द्यु-गणस् गत-निस्-अपवर्त-गुण-भाग-हार-युतस् ॥'
  source_text: 'iṣṭa-bha-gaṇa-ādi-śeṣāt sva-kuṭṭaka-guṇāt sva-bhāga-hāra-guṇāt/

    śeṣam dyu-gaṇas gata-nis-apavarta-guṇa-bhāga-hāra-yutas//  BSS_18.12'
  source: source.gretil-bss
  review: unreviewed
- id: verse.bss.18.13
  section: section.bss.18
  ordinal: 79
  ref_label: '18.13'
  devanagari: 'एवम् समेषु विषमेषु ऋणम् धनम् धनम् ऋणम् यत् उक्तम् तत् ।

    ऋण-धनयोस् व्यस्तत्वम् गुण्य-प्रक्षेपयोस् कार्यम् ॥'
  source_text: 'evam sameṣu viṣameṣu ṛṇam dhanam dhanam ṛṇam yat uktam tat/

    ṛṇa-dhanayos vyastatvam guṇya-prakṣepayos kāryam//  BSS_18.13'
  source: source.gretil-bss
  review: unreviewed
- id: verse.bss.18.14
  section: section.bss.18
  ordinal: 80
  ref_label: '18.14'
  devanagari: 'गुणकस् छेदस् छेदस् गुणकस् धनम् ऋणम् ऋणम् धनम् कार्यम् ।

    वर्गम् पदम् पदम् कृतिस् अन्त्यात् विपरीतम् आद्यम् तत् ॥'
  source_text: 'guṇakas chedas chedas guṇakas dhanam ṛṇam ṛṇam dhanam kāryam/

    vargam padam padam kṛtis antyāt viparītam ādyam tat//  BSS_18.14'
  source: source.gretil-bss
  review: unreviewed
- id: verse.bss.18.15
  section: section.bss.18
  ordinal: 81
  ref_label: '18.15'
  devanagari: 'यस् जानाति युग-आदि ग्रह-युग-यातैस् पृथक् पृथक् कथितैस् ।

    द्वि-त्रि-चतुर्-प्रभृतीनाम् कुट्टाकारम् सस् जानाति ॥'
  source_text: 'yas jānāti yuga-ādi graha-yuga-yātais pṛthak pṛthak kathitais/

    %dvi-%tri-%catur-prabhṛtīnām kuṭṭākāram sas jānāti//  BSS_18.15'
  source: source.gretil-bss
  review: unreviewed
- id: verse.bss.18.16
  section: section.bss.18
  ordinal: 82
  ref_label: '18.16'
  devanagari: 'भ-गण-आद्यम् इष्ट-शेषम् कदा इन्दु-दिवसे रवेस् गुरु-दिने वा ।

    ज्ञ-दिने राशीन् कथयति कुट्टाकारम् सस् जानाति ॥'
  source_text: 'bha-gaṇa-ādyam iṣṭa-śeṣam kadā indu-divase raves guru-dine vā/

    jña-dine rāśīn kathayati kuṭṭākāram sas jānāti//  BSS_18.16'
  source: source.gretil-bss
  review: unreviewed
- id: verse.bss.18.17
  section: section.bss.18
  ordinal: 83
  ref_label: '18.17'
  devanagari: 'ज्ञ-दिने यत् अंश-शेषम् विकला-शेषम् कदा तत् इन्दु-दिने ।

    भानोस् अथ वा शशिनस् यस् कथयति कुट्टक-ज्ञस् सस् ॥'
  source_text: 'jña-dine yat aṃśa-śeṣam vikalā-śeṣam kadā tat indu-dine/

    bhānos atha vā śaśinas yas kathayati kuṭṭaka-jñas sas//  BSS_18.17'
  source: source.gretil-bss
  review: unreviewed
- id: verse.bss.18.18
  section: section.bss.18
  ordinal: 84
  ref_label: '18.18'
  devanagari: 'तिथि-मान-दिनेषु इष्टास् ये अर्क-आद्यास् ते पुनर् कदा तेषु ।

    इष्ट-ग्रह-वारेषु यस् कथयति कुट्टक-ज्ञस् सस् ॥'
  source_text: 'tithi-māna-dineṣu iṣṭās ye arka-ādyās te punar kadā teṣu/

    iṣṭa-graha-vāreṣu yas kathayati kuṭṭaka-jñas sas//  BSS_18.18'
  source: source.gretil-bss
  review: unreviewed
- id: verse.bss.18.19
  section: section.bss.18
  ordinal: 85
  ref_label: '18.19'
  devanagari: 'इष्ट-भ-गण-आदि-शेषात् द्यु-गणस् तत् कुट्टकेन संयुक्तस् ।

    तद्-छेद-दिनैस् तावत् दिन-वारस् यावत् इष्टस् स्यात् ॥'
  source_text: 'iṣṭa-bha-gaṇa-ādi-śeṣāt dyu-gaṇas tat kuṭṭakena saṃyuktas/

    tad-cheda-dinais tāvat dina-vāras yāvat iṣṭas syāt//  BSS_18.19'
  source: source.gretil-bss
  review: unreviewed
- id: verse.bss.18.20
  section: section.bss.18
  ordinal: 86
  ref_label: '18.20'
  devanagari: 'यस् राशि-आदीन् दृष्ट्वा मध्यस्य इष्टस्य कतह्यति द्यु-गणम् ।

    द्वि-आदि-ग्रह-संयोगात् ग्रह-अन्तरात् वा सस् कुट्ट-ज्ञस् ॥'
  source_text: 'yas rāśi-ādīn dṛṣṭvā madhyasya iṣṭasya katahyati dyu-gaṇam/

    %dvi-ādi-graha-saṃyogāt graha-antarāt vā sas kuṭṭa-jñas//  BSS_18.20'
  source: source.gretil-bss
  review: unreviewed
- id: verse.bss.18.21
  section: section.bss.18
  ordinal: 87
  ref_label: '18.21'
  devanagari: 'निस्-छेद-भाग-हारात् राशि-आदि-कला-आदिना हतात् भक्तात् ।

    भ-गण-कलाभिस् लब्धम् मण्डल-शेषम् दिन-गणस् अस्मात् ॥'
  source_text: 'nis-cheda-bhāga-hārāt rāśi-ādi-kalā-ādinā hatāt bhaktāt/

    bha-gaṇa-kalābhis labdham maṇḍala-śeṣam dina-gaṇas asmāt//  BSS_18.21'
  source: source.gretil-bss
  review: unreviewed
- id: verse.bss.18.22
  section: section.bss.18
  ordinal: 88
  ref_label: '18.22'
  devanagari: 'एवम् राशि-अंश-कला-विकला-शेषात् अहर्-गणस् प्राक्-वत् ।

    नष्ट-स्थेषु इष्टान् तान् कृत्वा भक्त्वा उक्त-वत् शेषम् ॥'
  source_text: 'evam rāśi-aṃśa-kalā-vikalā-śeṣāt ahar-gaṇas prāk-vat/

    naṣṭa-stheṣu iṣṭān tān kṛtvā bhaktvā ukta-vat śeṣam//  BSS_18.22'
  source: source.gretil-bss
  review: unreviewed
- id: verse.bss.18.23
  section: section.bss.18
  ordinal: 89
  ref_label: '18.23'
  devanagari: 'राशि-अंश-कला-विकला-शेषात् कथितात् अभीष्टतस् नष्टान् ।

    यस् साधयति उपरितनान् स-मध्यमान् कुट्टक-ज्ञस् सस् ॥'
  source_text: 'rāśi-aṃśa-kalā-vikalā-śeṣāt kathitāt abhīṣṭatas naṣṭān/

    yas sādhayati uparitanān sa-madhyamān kuṭṭaka-jñas sas//  BSS_18.23'
  source: source.gretil-bss
  review: unreviewed
- id: verse.bss.18.24
  section: section.bss.18
  ordinal: 90
  ref_label: '18.24'
  devanagari: 'येन गुणस् शेष-युतस् छेदस् शुध्यति हृतस् स्व-गुणकेन ।

    तद्-भुक्तम् शेषम् फलम् एवम् शेषात् ग्रह-द्यु-गणौ ॥'
  source_text: 'yena guṇas śeṣa-yutas chedas śudhyati hṛtas sva-guṇakena/

    tad-bhuktam śeṣam phalam evam śeṣāt graha-dyu-gaṇau//  BSS_18.24'
  source: source.gretil-bss
  review: unreviewed
- id: verse.bss.18.25
  section: section.bss.18
  ordinal: 91
  ref_label: '18.25'
  devanagari: 'जानाति यस् युग-गतम् कथितात् अधिमास-शेषकात् इष्टात् ।

    अवम-अवशेषतस् वा तद्-योगात् वा सस् कुट्ट-ज्ञस् ॥'
  source_text: 'jānāti yas yuga-gatam kathitāt adhimāsa-śeṣakāt iṣṭāt/

    avama-avaśeṣatas vā tad-yogāt vā sas kuṭṭa-jñas//  BSS_18.25'
  source: source.gretil-bss
  review: unreviewed
- id: verse.bss.18.26
  section: section.bss.18
  ordinal: 92
  ref_label: '18.26'
  devanagari: 'इष्टेषु मान-दिवसेषु अधिमास-न्यून-रात्र-शेषे वा ।

    भूयस् ते यस् कथयति पृथक् पृथक् वा सस् कुट्ट-ज्ञस् ॥'
  source_text: 'iṣṭeṣu māna-divaseṣu adhimāsa-nyūna-rātra-śeṣe vā/

    bhūyas te yas kathayati pṛthak pṛthak vā sas kuṭṭa-jñas//  BSS_18.26'
  source: source.gretil-bss
  review: unreviewed
- id: verse.bss.18.27
  section: section.bss.18
  ordinal: 93
  ref_label: '18.27'
  devanagari: 'अंशक-शेषात् त्रि-ऊनात् सप्त-हृतात् मूलम् ऊनम् अष्टाभिस् ।

    नवभिस् गुणम् स-रूपम् कदा शतम् बुध-दिने सवितुस् ॥'
  source_text: 'aṃśaka-śeṣāt %tri-ūnāt %sapta-hṛtāt mūlam ūnam %aṣṭābhis/

    %navabhis guṇam sa-#rūpam kadā %śatam budha-dine savitus//  BSS_18.27'
  source: source.gretil-bss
  review: unreviewed
- id: verse.bss.18.28
  section: section.bss.18
  ordinal: 94
  ref_label: '18.28'
  devanagari: 'त्रि-ऊन-अधिमास-शेषात् मूलम् द्वि-अधिकम् विभाजितम् षड्भिस् ।

    द्वि-ऊनम् वर्गितम् अधिकम् नवभिस् नवतिस् कदा भवति ॥'
  source_text: '%tri-ūna-adhimāsa-śeṣāt mūlam %dvi-adhikam vibhājitam %ṣaḍbhis/

    %dvi-ūnam vargitam adhikam %navabhis %navatis kadā bhavati//  BSS_18.28'
  source: source.gretil-bss
  review: unreviewed
- id: verse.bss.18.29
  section: section.bss.18
  ordinal: 95
  ref_label: '18.29'
  devanagari: 'अवम-अवशेष-वर्गस् वि-एकस् विंशति-विभाजितस् द्वि-अधिकस् ।

