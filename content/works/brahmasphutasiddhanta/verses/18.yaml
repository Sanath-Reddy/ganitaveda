  section: section.bss.18
  ordinal: 167
  ref_label: '18.101'
  devanagari: 'जन-संसदि दैव-विदाम् तेजस् नाशयति भानुस् इव भानाम् ।

    कुट्टाकार-प्रश्नैस् पथितैस् अपि किम् पुनर् शत-शस् ॥'
  source_text: 'jana-saṃsadi daiva-vidām tejas nāśayati bhānus iva bhānām/

    kuṭṭākāra-praśnais pathitais api kim punar %śata-śas//  BSS_18.101'
  source: source.gretil-bss
  review: unreviewed
- id: verse.bss.18.102
