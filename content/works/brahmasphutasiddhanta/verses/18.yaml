  ref_label: '18.102'
  devanagari: 'प्रति-सूत्रम् अमी प्रश्नास् पथितास् स-उद्देशकेषु सूत्रेषु ।

    आर्या-त्रि-अधिक-शतेन च कुट्टस् च अष्टादशस् अध्यायस् ॥

    इति श्री-ब्राह्मस्फुटसिद्धान्ते कुट्टक-अध्यायस् अष्टादशस् ॥'
  source_text: 'prati-sūtram amī praśnās pathitās sa-uddeśakeṣu sūtreṣu/

    āryā-%tri-adhika-%śatena ca kuṭṭas ca %aṣṭādaśas adhyāyas//

    iti śrī-brāhmasphuṭasiddhānte kuṭṭaka-adhyāyas %aṣṭādaśas// BSS_18.102'
  source: source.gretil-bss
  review: unreviewed
