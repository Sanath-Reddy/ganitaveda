  ordinal: 57
  ref_label: '12.57'
  devanagari: 'छेदेन इष्ट-युत-ऊनेन आप्तम् भाज्यात् अनष्टम् इष्ट-गुणम् ।

    प्रकृति-स्थ-छेद-हृतम् लब्ध्या युत-हीनकम् अनष्टम् ॥'
  source_text: 'chedena iṣṭa-yuta-ūnena āptam bhājyāt anaṣṭam iṣṭa-guṇam/

    prakṛti-stha-cheda-hṛtam labdhyā yuta-hīnakam anaṣṭam// BSS_12.57'
  source: source.gretil-bss
  review: unreviewed
- id: verse.bss.12.58
  section: section.bss.12
  ordinal: 58
  ref_label: '12.58'
  devanagari: 'गुण्यस् छेद-फल-वधस् गुणक-हृतस् गुण्य-भाजितस् गुणकस् ।

    छेद-उद्धृतस् फलम् गुण्य-गुण-वधस् फल-हृतस् छेदस् ॥'
  source_text: 'guṇyas cheda-phala-vadhas guṇaka-hṛtas guṇya-bhājitas guṇakas/

    cheda-uddhṛtas phalam guṇya-guṇa-vadhas phala-hṛtas chedas// BSS_12.58'
  source: source.gretil-bss
  review: unreviewed
- id: verse.bss.12.59
  section: section.bss.12
  ordinal: 59
  ref_label: '12.59'
  devanagari: 'गुण्य-गुण-कारयोस् छेद-लब्धयोस् यदि द्वयोस् द्वयोस् नाशस् ।

    तेषाम् दृश्यौ व्यस्तौ कृत्वा तद्-स्थानयोस् च इष्टौ ॥'
  source_text: 'guṇya-guṇa-kārayos cheda-labdhayos yadi %dvayos %dvayos nāśas/

    teṣām dṛśyau vyastau kṛtvā tad-sthānayos ca iṣṭau// BSS_12.59'
  source: source.gretil-bss
  review: unreviewed
- id: verse.bss.12.60
  section: section.bss.12
  ordinal: 60
  ref_label: '12.60'
  devanagari: 'गुण्यम् गुण-कारम् वा गुणयेत् छेदेन भाग-हारस्य ।

    गुण्य-गुण-कार-राश्योस् छेद-गुणस् भाग-हारस् च ॥'
  source_text: 'guṇyam guṇa-kāram vā guṇayet chedena bhāga-hārasya/

    guṇya-guṇa-kāra-rāśyos cheda-guṇas bhāga-hāras ca// BSS_12.60'
  source: source.gretil-bss
  review: unreviewed
- id: verse.bss.12.61
  section: section.bss.12
  ordinal: 61
  ref_label: '12.61'
  devanagari: 'अच्छेदस्य छेदम् रूपम् कृत्वा अन्यत् उक्त-वत् सर्वम् ।

    अपवर्त्यौ छेद-गुणौ तुल्येन इष्टेन गुण्यौ वा ॥'
  source_text: 'acchedasya chedam #rūpam kṛtvā anyat ukta-vat sarvam/

    apavartyau cheda-guṇau tulyena iṣṭena guṇyau vā// BSS_12.61'
  source: source.gretil-bss
  review: unreviewed
- id: verse.bss.12.62
  section: section.bss.12
  ordinal: 62
  ref_label: '12.62'
  devanagari: 'स्व-विकल-षष्टि-अंश-गुणस् सकलस् त्रिंश-उद्धृतस् विकल-वर्गस् ।

    प्रक्षेप्यस् सकल-कृतौ वर्ग-घनौ द्वि-त्रि-तुल्य-वधौ ॥'
  source_text: 'sva-vikala-%ṣaṣṭi-aṃśa-guṇas sakalas %triṃśa-uddhṛtas vikala-vargas/

    prakṣepyas sakala-kṛtau varga-ghanau %dvi-%tri-tulya-vadhau// BSS_12.62'
  source: source.gretil-bss
  review: unreviewed
- id: verse.bss.12.63
  section: section.bss.12
  ordinal: 63
  ref_label: '12.63'
  devanagari: 'राशेस् ऊनम् द्वि-गुणम् बहुतर-गुणम् ऊन-कृति-युतम् वर्गस् ।

    राशेस् इष्ट-युत-ऊनात् वधस् कृतिस् वा इष्ट-कृति-युक्तस् ॥'
  source_text: 'rāśes ūnam %dvi-guṇam bahutara-guṇam ūna-kṛti-yutam vargas/

    rāśes iṣṭa-yuta-ūnāt vadhas kṛtis vā iṣṭa-kṛti-yuktas// BSS_12.63'
  source: source.gretil-bss
  review: unreviewed
- id: verse.bss.12.64
  section: section.bss.12
  ordinal: 64
  ref_label: '12.64'
  devanagari: 'इष्ट-अल्प-राशि-वर्गौ युक्त-ऊनौ इतर-विकल-वर्गाभ्याम् ।

    द्वि-गुण-इतर-राशिभ्याम् भक्तौ तेन अधिक-ऊनाभ्याम् ॥'
  source_text: 'iṣṭa-alpa-rāśi-vargau yukta-ūnau itara-vikala-vargābhyām/

    %dvi-guṇa-itara-rāśibhyām bhaktau tena adhika-ūnābhyām// BSS_12.64'
  source: source.gretil-bss
  review: unreviewed
- id: verse.bss.12.65
  section: section.bss.12
  ordinal: 65
  ref_label: '12.65'
  devanagari: 'स्थान-अन्तरेषु लब्धम् येन समम् फल-युत-ऊनक-छेदस् ।

    दलितस् कृति-योग-अन्तर-पदम् इतरस् वा फल-युत-ऊनस् ॥'
  source_text: 'sthāna-antareṣu labdham yena samam phala-yuta-ūnaka-chedas/

    dalitas kṛti-yoga-antara-padam itaras vā phala-yuta-ūnas// BSS_12.65'
  source: source.gretil-bss
  review: unreviewed
- id: verse.bss.12.66
  section: section.bss.12
  ordinal: 66
  ref_label: '12.66'
  devanagari: 'दिक्-मात्रम् एतत् अन्यत् ज्या-उत्पत्तौ कुट्टके च कथयिष्ये ।

    सङ्कलित-आदिषु आर्यास् षट्षष्टिस् द्वादशस् अध्यायस् ॥

    इति श्री-ब्राह्म-स्फुट-सिद्धान्ते द्वादशस् अध्यायस् ॥ ॥'
  source_text: 'dik-mātram etat anyat jyā-utpattau kuṭṭake ca kathayiṣye/

    saṅkalita-ādiṣu āryās %ṣaṭṣaṣṭis %dvādaśas adhyāyas//

    iti śrī-brāhma-sphuṭa-siddhānte %dvādaśas adhyāyas//12// BSS_12.66'
  source: source.gretil-bss
  review: unreviewed
