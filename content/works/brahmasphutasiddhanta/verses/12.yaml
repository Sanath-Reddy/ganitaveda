- id: verse.bss.12.1
  section: section.bss.12
  ordinal: 1
  ref_label: '12.1'
  devanagari: 'परिकर्म-विंशतिम् यस् सङ्कलित-आद्याम् पृथक् विजानाति ।

    अष्टौ च व्यवहारान् छाया-अन्तान् भवति गणकस् सस् ॥'
  source_text: 'parikarma-%viṃśatim yas saṅkalita-ādyām pṛthak vijānāti/

    %aṣṭau ca vyavahārān chāyā-antān bhavati gaṇakas sas// BSS_12.1'
  source: source.gretil-bss
  review: unreviewed
- id: verse.bss.12.2
  section: section.bss.12
  ordinal: 2
  ref_label: '12.2'
  devanagari: 'विपरीत-छेद-गुणास् राश्योस् छेद-अंशकास् सम-छेदास् ।

    सङ्कलिते अंशास् योज्यास् व्यवकलिते अंश-अन्तरम् कार्यम् ॥'
  source_text: 'viparīta-cheda-guṇās rāśyos cheda-aṃśakās sama-chedās/

    saṅkalite aṃśās yojyās vyavakalite aṃśa-antaram kāryam// BSS_12.2'
  source: source.gretil-bss
  review: unreviewed
- id: verse.bss.12.3
  section: section.bss.12
  ordinal: 3
  ref_label: '12.3'
  devanagari: 'रूपाणि छेद-गुणानि अंश-युतानि द्वयोस् बहूनाम् वा ।

    प्रत्युत्पन्नस् भवति छेद-वधेन उद्धृतस् अंश-वधस् ॥'
  source_text: 'rūpāṇi cheda-guṇāni aṃśa-yutāni %dvayos bahūnām vā/

    pratyutpannas bhavati cheda-vadhena uddhṛtas aṃśa-vadhas// BSS_12.3'
  source: source.gretil-bss
  review: unreviewed
- id: verse.bss.12.4
  section: section.bss.12
  ordinal: 4
  ref_label: '12.4'
  devanagari: 'परिवर्त्य भाग-हार-छेद-अंशौ छेद-संगुण-छेदस् ।

    अंशस् अंश-गुणस् भाज्यस्य भाग-हारस् सवर्णितयोस् ॥'
  source_text: 'parivartya bhāga-hāra-cheda-aṃśau cheda-saṃguṇa-chedas/

    aṃśas aṃśa-guṇas bhājyasya bhāga-hāras savarṇitayos// BSS_12.4'
  source: source.gretil-bss
  review: unreviewed
- id: verse.bss.12.5
  section: section.bss.12
  ordinal: 5
  ref_label: '12.5'
  devanagari: 'संवर्णित-अंश-वर्गस् छेद-कृति-विभाजितस् भवति वर्गस् ।

    संवर्णित-अंश-मूलम् छेद-पदेन उद्धृतम् मूलम् ॥'
  source_text: 'saṃvarṇita--aṃśa-vargas cheda-kṛti-vibhājitas bhavati vargas/

    saṃvarṇita-aṃśa-mūlam cheda-padena uddhṛtam mūlam// BSS_12.5'
  source: source.gretil-bss
  review: unreviewed
- id: verse.bss.12.6
  section: section.bss.12
  ordinal: 6
  ref_label: '12.6'
  devanagari: 'स्थाप्यस् अन्त्य-घनस् अन्त्य-कृतिस् त्रि-गुण-उत्तर-सङ्गुणा च तद्-प्रथमात् ।

    उत्तर-कृतिस् अन्त्य-गुणा त्रि-गुणा च उत्तर-घनस् च घनस् ॥'
  source_text: 'sthāpyas antya-ghanas antya-kṛtis %tri-guṇa-uttara-saṅguṇā ca tad-%prathamāt/

    uttara-kṛtis antya-guṇā %tri-guṇā ca uttara-ghanas ca ghanas// BSS_12.6'
  source: source.gretil-bss
  review: unreviewed
- id: verse.bss.12.7
  section: section.bss.12
  ordinal: 7
  ref_label: '12.7'
  devanagari: 'छेदस् घनात् द्वितीयात् घन-मूल-कृतिस् त्रि-सङ्गुणा आप्त-कृतिस् ।

    शोध्या त्रि-पूर्व-गुणिता प्रथमात् घनतस् घनस् मूलम् ॥'
  source_text: 'chedas ghanāt %dvitīyāt ghana-mūla-kṛtis %tri-saṅguṇā āpta-kṛtis/

    śodhyā %tri-pūrva-guṇitā %prathamāt ghanatas ghanas mūlam// BSS_12.7'
  source: source.gretil-bss
  review: unreviewed
- id: verse.bss.12.8
  section: section.bss.12
  ordinal: 8
  ref_label: '12.8'
  devanagari: 'सदृश-छेद-अंश-युतिस् छेद-विभक्ता फलम् प्रथम-जातौ ।

    अंशैस् अंशास् गुणितास् छेदैस् छेदास् द्वितीयायाम् ॥'
  source_text: 'sadṛśa-cheda-aṃśa-yutis cheda-vibhaktā phalam %prathama-jātau/

    aṃśais aṃśās guṇitās chedais chedās %dvitīyāyām// BSS_12.8'
  source: source.gretil-bss
  review: unreviewed
- id: verse.bss.12.9
  section: section.bss.12
  ordinal: 9
  ref_label: '12.9'
  devanagari: 'ऊर्ध्व-अंशास् छेद-गुणास् तृतीय-जातौ द्वयोस् प्रथम-परयोस् ।

    छेदैस् छेदास् गुणितास् स्व-अंश-युत-ऊनैस् उपरि-ग-अंशास् ॥'
  source_text: 'ūrdhva-aṃśās cheda-guṇās %tṛtīya-jātau %dvayos %prathama-parayos/

    chedais chedās guṇitās sva-aṃśa-yuta-ūnais upari-ga-aṃśās// BSS_12.9'
  source: source.gretil-bss
  review: unreviewed
- id: verse.bss.12.10
  section: section.bss.12
  ordinal: 10
  ref_label: '12.10'
  devanagari: 'त्रैराशिके प्रमाणम् फलम् इच्चा आदि-अन्तयोस् सदृश-राशी ।

    इच्छा फलेन गुणिता प्रमाण-भक्ता फलम् भवति ॥'
  source_text: 'trairāśike pramāṇam phalam iccā ādi-antayos sadṛśa-rāśī/

    icchā phalena guṇitā pramāṇa-bhaktā phalam bhavati// BSS_12.10'
  source: source.gretil-bss
  review: unreviewed
- id: verse.bss.12.11
  section: section.bss.12
  ordinal: 11
  ref_label: '12.11'
  devanagari: 'व्यस्त-त्रैराशिक-फलम् इच्छा-भक्तस् प्रमाण-फल-घातस् ।

    त्रैराशिक-आदिषु फलम् विषमेषु एकादश-अन्तेषु ॥'
  source_text: 'vyasta-trairāśika-phalam icchā-bhaktas pramāṇa-phala-ghātas/

    trairāśika-ādiṣu phalam viṣameṣu %ekādaśa-anteṣu// BSS_12.11'
  source: source.gretil-bss
  review: unreviewed
- id: verse.bss.12.12
  section: section.bss.12
  ordinal: 12
  ref_label: '12.12'
  devanagari: 'फल-सङ्क्रमणम् उभय-तस् बहु-राशि-वधस् अल्प-वध-हृतस् ज्ञेयम् ।

    सकलेषु एवम् भिन्नेषु उभय-तस् छेद-सङ्क्रमणम् ॥'
  source_text: 'phala-saṅkramaṇam ubhaya-tas bahu-rāśi-vadhas alpa-vadha-hṛtas jñeyam/

    sakaleṣu evam bhinneṣu ubhaya-tas cheda-saṅkramaṇam// BSS_12.12'
  source: source.gretil-bss
  review: unreviewed
- id: verse.bss.12.13
  section: section.bss.12
  ordinal: 13
  ref_label: '12.13'
  devanagari: 'प्राक् मूल्य-व्यत्यासस् भाण्डप्रतिभाण्डके अन्यत् उक्त-समम् ।

    परिकर्माणि अष्टानाम् व्यवहाराणाम् अभिहितानि ॥'
  source_text: 'prāk mūlya-vyatyāsas bhāṇḍapratibhāṇḍake anyat ukta-samam/

    parikarmāṇi %aṣṭānām vyavahārāṇām abhihitāni// BSS_12.13'
  source: source.gretil-bss
  review: unreviewed
- id: verse.bss.12.14
  section: section.bss.12
  ordinal: 14
  ref_label: '12.14'
  devanagari: 'काल-गुणितम् प्रमाणम् फल-भक्तम् वि-एक-गुण-हतम् कालस् ।

    स्व-फल-युत-रूप-भक्तम् मूल-फल-ऐक्यम् भवति मूलम् ॥'
  source_text: 'kāla-guṇitam pramāṇam phala-bhaktam vi-%eka-guṇa-hatam kālas/

    sva-phala-yuta-#rūpa-bhaktam mūla-phala-aikyam bhavati mūlam// BSS_12.14'
  source: source.gretil-bss
  review: unreviewed
- id: verse.bss.12.15
  section: section.bss.12
  ordinal: 15
  ref_label: '12.15'
  devanagari: 'काल-प्रमाण-घातस् पर-काल-हृतस् द्विधा आद्य-मिश्र-वधात् ।

    अन्य-अर्ध-कृति-युतात् पदम् अन्य-अर्ध-ऊनम् प्रमाण-फलम् ॥'
  source_text: 'kāla-pramāṇa-ghātas para-kāla-hṛtas dvidhā ādya-miśra-vadhāt/

    anya-%ardha-kṛti-yutāt padam anya-%ardha-ūnam pramāṇa-phalam// BSS_12.15'
  source: source.gretil-bss
  review: unreviewed
- id: verse.bss.12.16
  section: section.bss.12
  ordinal: 16
  ref_label: '12.16'
  devanagari: 'प्रक्षेप-योग-हृतया लब्ध्या प्रक्षेपकास् गुणास् लाभास् ।

    ऊन-अधिक-उत्तरास् तद्-युत-ऊनया स्व-फलम् ऊन-युतम् ॥'
  source_text: 'prakṣepa-yoga-hṛtayā labdhyā prakṣepakās guṇās lābhās/

    ūna-adhika-uttarās tad-yuta-ūnayā sva-phalam ūna-yutam// BSS_12.16'
  source: source.gretil-bss
  review: unreviewed
- id: verse.bss.12.17
  section: section.bss.12
  ordinal: 17
  ref_label: '12.17'
  devanagari: 'पदम् एक-हीनम् उत्तर-गुणितम् संयुक्तम् आदिना अन्त्य-धनम् ।

    आदि-युत-अन्त्य-धन-अर्धम् मध्य-धनम् पद-गुणम् गणितम् ॥'
  source_text: 'padam %eka-hīnam uttara-guṇitam saṃyuktam ādinā antya-dhanam/

    ādi-yuta-antya-dhana-%ardham madhya-dhanam pada-guṇam gaṇitam// BSS_12.17'
  source: source.gretil-bss
  review: unreviewed
- id: verse.bss.12.18
  section: section.bss.12
  ordinal: 18
  ref_label: '12.18'
  devanagari: 'उत्तर-हीन-द्वि-गुण-आदि-शेष-वर्गम् धन-उत्तर-अष्ट-वधे ।

    प्रक्षिप्य पदम् शेष-ऊनम् द्वि-गुण-उत्तर-हृतम् गच्छस् ॥'
  source_text: 'uttara-hīna-%dvi-guṇa-ādi-śeṣa-vargam dhana-uttara-%aṣṭa-vadhe/

    prakṣipya padam śeṣa-ūnam %dvi-guṇa-uttara-hṛtam gacchas// BSS_12.18'
  source: source.gretil-bss
  review: unreviewed
- id: verse.bss.12.19
  section: section.bss.12
  ordinal: 19
  ref_label: '12.19'
  devanagari: 'एक-उत्तरम् एक-आद्यम् यदि इष्ट-गच्छस्य भवति सङ्कलितम् ।

    तत् द्वि-युत-गच्छ-गुणितम् त्रि-हृतम् सङ्कलित-सङ्कलितम् ॥'
  source_text: '%eka-uttaram %eka-ādyam yadi iṣṭa-gacchasya bhavati saṅkalitam/

    tat %dvi-yuta-gaccha-guṇitam %tri-hṛtam saṅkalita-saṅkalitam// BSS_12.19'
  source: source.gretil-bss
  review: unreviewed
- id: verse.bss.12.20
  section: section.bss.12
  ordinal: 20
  ref_label: '12.20'
  devanagari: 'द्वि-गुण-पद-स-एक-गुणितम् तत् त्रि-हृतम् भवति वर्ग-सङ्कलितम् ।

    घन-सङ्कलितम् तद्-कृतिस् एषाम् सम-गोलकैस् चितयस् ॥'
  source_text: '%dvi-guṇa-pada-sa-%eka-guṇitam tat %tri-hṛtam bhavati varga-saṅkalitam/

    ghana-saṅkalitam tad-kṛtis eṣām sama-golakais citayas// BSS_12.20'
  source: source.gretil-bss
  review: unreviewed
- id: verse.bss.12.21
  section: section.bss.12
  ordinal: 21
  ref_label: '12.21'
  devanagari: 'स्थूल-फलम् त्रि-चतुर्-भुज-बाहु-प्रतिबाहु-योग-दल-घातस् ।

    भुज-योग-अर्ध-चतुष्टय-भुज-ऊन-घातात् पदम् सूक्ष्मम् ॥'
  source_text: 'sthūla-phalam %tri-%catur-bhuja-bāhu-pratibāhu-yoga-#dala-ghātas/

    bhuja-yoga-%ardha-%catuṣṭaya-bhuja-ūna-ghātāt padam sūkṣmam// BSS_12.21'
  source: source.gretil-bss
  review: unreviewed
- id: verse.bss.12.22
  section: section.bss.12
  ordinal: 22
  ref_label: '12.22'
  devanagari: 'भुज-कृति-अन्तर-भू-हृत-हीन-युता भूस् द्वि-भाजिता आवाधे ।

    स्व-आवाधा-वर्ग-ऊनात् भुज-वर्गात् मूलम् अवलम्बस् ॥'
  source_text: 'bhuja-kṛti-antara-bhū-hṛta-hīna-yutā bhūs %dvi-bhājitā āvādhe/

    sva-āvādhā-varga-ūnāt bhuja-vargāt mūlam avalambas// BSS_12.22'
  source: source.gretil-bss
  review: unreviewed
- id: verse.bss.12.23
  section: section.bss.12
  ordinal: 23
  ref_label: '12.23'
  devanagari: 'अविषम-चतुर्-अस्र-भुज-प्रतिभुज-वधयोस् युतेस् पदम् कर्णस् ।

    कर्ण-कृतिस् भू-मुख-युति-दल-वर्ग-ऊना पदम् लम्बस् ॥'
  source_text: 'aviṣama-%catur-asra-bhuja--pratibhuja-vadhayos yutes padam karṇas/

    karṇa-kṛtis bhū-mukha-yuti-#dala-varga-ūnā padam lambas// BSS_12.23'
  source: source.gretil-bss
  review: unreviewed
- id: verse.bss.12.24
  section: section.bss.12
  ordinal: 24
  ref_label: '12.24'
  devanagari: 'कर्ण-कृतेस् कोटि-कृतिम् विशोध्य मूलम् भुजस् भुजस्य कृतिम् ।

    प्रोह्य पदम् कोटिस् कोटि-बाहु-कृति-युति-पदम् कर्णस् ॥'
  source_text: 'karṇa-kṛtes koṭi-kṛtim viśodhya mūlam bhujas bhujasya kṛtim/

    prohya padam koṭis koṭi-bāhu-kṛti-yuti-padam karṇas//  BSS_12.24'
  source: source.gretil-bss
  review: unreviewed
- id: verse.bss.12.25
  section: section.bss.12
  ordinal: 25
  ref_label: '12.25'
  devanagari: 'कर्ण-युतौ ऊर्ध्व-अधर-खण्डे कर्ण-अवलम्ब-योगे वा ।

    स्व-आवाधे स्व-युति-हृते द्विधा पृथक् कर्ण-लम्ब-गुणे ॥'
  source_text: 'karṇa-yutau ūrdhva-adhara-khaṇḍe karṇa-avalamba-yoge vā/

    sva-āvādhe sva-yuti-hṛte dvidhā pṛthak karṇa-lamba-guṇe// BSS_12.25'
  source: source.gretil-bss
  review: unreviewed
- id: verse.bss.12.26
  section: section.bss.12
  ordinal: 26
  ref_label: '12.26'
  devanagari: 'अविषम-पार्श्व-भुज-गुणस् कर्णस् द्वि-गुण-अवलम्बक-विभक्तस् ।

    हृदयम् विषमस्य भुज-प्रतिभुज-कृति-योग-मूल-अर्धम् ॥'
  source_text: 'aviṣama-pārśva-bhuja-guṇas karṇas %dvi-guṇa-avalambaka-vibhaktas/

    hṛdayam viṣamasya bhuja-pratibhuja-kṛti-yoga-mūla-%ardham// BSS_12.26'
  source: source.gretil-bss
  review: unreviewed
- id: verse.bss.12.27
  section: section.bss.12
  ordinal: 27
  ref_label: '12.27'
  devanagari: 'त्रि-भुजस्य वधस् भुजयोस् द्वि-गुणित-लम्ब-उद्धृतस् हृदय-रज्जुस् ।

    सा द्वि-गुणा त्रि-चतुर्-भुज-कोण-स्पृक् वृत्त-विष्कम्भस् ॥'
  source_text: '%tri-bhujasya vadhas bhujayos %dvi-guṇita-lamba-uddhṛtas hṛdaya-rajjus/

    sā %dvi-guṇā %tri-%catur-bhuja-koṇa-spṛk vṛtta-viṣkambhas// BSS_12.27'
  source: source.gretil-bss
  review: unreviewed
- id: verse.bss.12.28
  section: section.bss.12
  ordinal: 28
  ref_label: '12.28'
  devanagari: 'कर्ण-आश्रित-भुज-घात-ऐक्यम् उभयथा अन्योन्य-भाजितम् गुणयेत् ।

    योगेन भुज-प्रतिभुज-वधयोस् कर्णौ पदे विषमे ॥'
  source_text: 'karṇa-āśrita-bhuja-ghāta-aikyam ubhayathā anyonya-bhājitam guṇayet/

    yogena bhuja-pratibhuja-vadhayos karṇau pade viṣame// BSS_12.28'
  source: source.gretil-bss
  review: unreviewed
- id: verse.bss.12.29
  section: section.bss.12
  ordinal: 29
  ref_label: '12.29'
  devanagari: 'विषम-चतुर्-अस्र-मध्ये विषम-त्रि-भुज-द्वयम् प्रकल्प्य पृथक् ।

