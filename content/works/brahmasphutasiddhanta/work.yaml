licence: licence.cc-by-nc-sa-4
text_form: analytic
about:
  en: Brahmagupta's treatise on astronomy, completed in 628 CE. Chapter 12 covers arithmetic and geometry; chapter 18 covers algebra, including rules for zero and negative numbers and the pulveriser. Version 1 includes chapters 12 and 18.
  kn: ಕ್ರಿ.ಶ. 628ರಲ್ಲಿ ಪೂರ್ಣಗೊಂಡ ಬ್ರಹ್ಮಗುಪ್ತನ ಖಗೋಳಶಾಸ್ತ್ರ ಗ್ರಂಥ. 12ನೇ ಅಧ್ಯಾಯ ಅಂಕಗಣಿತ ಮತ್ತು ರೇಖಾಗಣಿತವನ್ನು, 18ನೇ ಅಧ್ಯಾಯ ಬೀಜಗಣಿತವನ್ನು (ಸೊನ್ನೆ ಮತ್ತು ಋಣ ಸಂಖ್ಯೆಗಳ ನಿಯಮಗಳು, ಕುಟ್ಟಕ ಸಹಿತ) ಒಳಗೊಂಡಿದೆ. ಮೊದಲ ಆವೃತ್ತಿಯಲ್ಲಿ 12 ಮತ್ತು 18ನೇ ಅಧ್ಯಾಯಗಳಿವೆ.
