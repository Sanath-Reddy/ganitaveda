about:
  en: Āryabhaṭa's short book in 121 verses, in four parts. Version 1 includes the root verses of the Gaṇitapāda, the part on mathematics. The e-text separates words without sandhi.
  kn: ಆರ್ಯಭಟನ 121 ಪದ್ಯಗಳ ಸಣ್ಣ ಗ್ರಂಥ, ನಾಲ್ಕು ಭಾಗಗಳಲ್ಲಿದೆ. ಮೊದಲ ಆವೃತ್ತಿಯಲ್ಲಿ ಗಣಿತದ ಭಾಗವಾದ ಗಣಿತಪಾದದ ಮೂಲ ಪದ್ಯಗಳಿವೆ. ಇ-ಪಠ್ಯದಲ್ಲಿ ಪದಗಳನ್ನು ಸಂಧಿ ಮಾಡದೆ ಬೇರ್ಪಡಿಸಲಾಗಿದೆ.
