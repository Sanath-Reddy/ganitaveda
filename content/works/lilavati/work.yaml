id: work.lilavati
title:
  en: Līlāvatī
  kn: ಲೀಲಾವತೀ
title_iast: Līlāvatī
author: person.bhaskara-ii
year_from: 1150
year_to: 1150
source: source.gretil-lilavati
licence: licence.cc-by-nc-sa-4
text_form: analytic
about:
  en: The arithmetic and geometry book of Bhāskara's Siddhāntaśiromaṇi, written in verse. Many problems are addressed to a girl called Līlāvatī. The Sanskrit here follows Takao Hayashi's e-text, which writes each word separately (without sandhi) and joins compound words with hyphens.
  kn: ಭಾಸ್ಕರನ ಸಿದ್ಧಾಂತಶಿರೋಮಣಿಯ ಅಂಕಗಣಿತ ಮತ್ತು ರೇಖಾಗಣಿತದ ಭಾಗ, ಪದ್ಯರೂಪದಲ್ಲಿದೆ. ಅನೇಕ ಲೆಕ್ಕಗಳು ಲೀಲಾವತಿ ಎಂಬ ಹುಡುಗಿಯನ್ನು ಉದ್ದೇಶಿಸಿವೆ. ಇಲ್ಲಿನ ಸಂಸ್ಕೃತ ಪಾಠ ತಕಾವೊ ಹಯಾಶಿ ಅವರ ಇ-ಪಠ್ಯವನ್ನು ಅನುಸರಿಸುತ್ತದೆ; ಅದರಲ್ಲಿ ಪದಗಳನ್ನು ಸಂಧಿ ಮಾಡದೆ ಬೇರೆಬೇರೆಯಾಗಿ ಬರೆದು, ಸಮಾಸದ ಪದಗಳನ್ನು ಅಡ್ಡಗೆರೆಯಿಂದ ಜೋಡಿಸಲಾಗಿದೆ.
