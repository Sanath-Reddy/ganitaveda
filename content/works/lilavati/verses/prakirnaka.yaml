  source: source.gretil-lilavati
  review: unreviewed
- id: verse.lilavati.85
  section: section.lilavati.prakirnaka
  ordinal: 76
  ref_label: '85'
  devanagari: 'विस्तारे त्रि-करास् कर-अष्टक-मितास् दैर्घ्ये विचित्रास् च चेद् रूपैस् उत्कट-पट्ट-सूत्र-पटिकास् अष्टौ लभन्ते शतम् ।

    दैर्घ्ये स-अर्ध-कर-त्रया अपर-पटी हस्त-अर्ध-विस्तारिणी तादृक् किम् लभते द्रुतम् वद वणिक् वाणिज्यकम् वेत्सि चेद् ॥'
  source_text: 'vistāre %tri-karās kara-%aṣṭaka-mitās dairghye vicitrās ca ced rūpais utkaṭa-paṭṭa-sūtra-paṭikās %aṣṭau @labhante %śatam/

    dairghye sa-%ardha-kara-%trayā apara-paṭī hasta-%ardha-vistāriṇī tādṛk kim @labhate drutam @vada vaṇik vāṇijyakam @vetsi ced// Lil_85'
  source: source.gretil-lilavati
  review: unreviewed
- id: verse.lilavati.86
  section: section.lilavati.prakirnaka
  ordinal: 77
  ref_label: '86'
  devanagari: 'पिण्डे ये अर्क-मित-अङ्गुलास् किल चतुर्-वर्ग-अङ्गुलास् विस्तृतौ पट्टास् दीर्घतया चतुर्दश-करास् त्रिंशत् लभन्ते शतम् ।

    एतास् विस्तृति-पिण्ड-दैर्घ्य-मितयस् येषाम् चतुर्-वर्जितास् पट्टास् ते वद मे चतुर्दश सखे मौल्यम् लभन्ते कियत् ॥'
  source_text: 'piṇḍe ye #arka-mita-aṅgulās kila %catur-varga-aṅgulās vistṛtau paṭṭās dīrghatayā %caturdaśa-karās %triṃśat @labhante %śatam/

    etās vistṛti-piṇḍa-dairghya-mitayas yeṣām %catur-varjitās paṭṭās te @vada me %caturdaśa sakhe maulyam @labhante kiyat// Lil_86'
  source: source.gretil-lilavati
  review: unreviewed
- id: verse.lilavati.87
  section: section.lilavati.prakirnaka
  ordinal: 78
  ref_label: '87'
  devanagari: 'पट्टास् ये प्रथम-उदित-प्रमितयस् गव्यूति-मात्रे स्थितास् तेषाम् आनयनाय चेद् शकटिनाम् द्रम्म-अष्टकम् भाटकम् ।

    अन्ये ये तद्-अनन्तरम् निगदितास् मानैस् चतुर्-वर्जितास् तेषाम् का भवति इति भाटक-मितिस् गव्यूति-षट्के वद ॥'
  source_text: 'paṭṭās ye %prathama-udita-pramitayas gavyūti-mātre sthitās teṣām ānayanāya ced śakaṭinām dramma-%aṣṭakam bhāṭakam/

    anye ye tad-anantaram nigaditās mānais %catur-varjitās teṣām kā @bhavati iti bhāṭaka-mitis gavyūti-%ṣaṭke @vada// Lil_87'
  source: source.gretil-lilavati
  review: unreviewed
- id: verse.lilavati.89
  section: section.lilavati.prakirnaka
  ordinal: 79
  ref_label: '89'
  devanagari: 'द्रम्मेण लभ्यते इह आम्र-शत-त्रयम् चेद् त्रिंशत्-पणेन विपणौ वर-दाडिमानि ।

    आम्रैस् वद आशु दशभिस् कति दाडिमानि लभ्यानि तद्-विनिमयेन भवन्ति मित्र ॥

    न्यासस् लब्धानि दाडिमानि ॥ इति गणित-पाट्याम् लीलावत्याम् प्रकीर्णकानि ॥'
  source_text: 'drammeṇa @labhyate iha āmra-%śata-%trayam ced %triṃśat-paṇena vipaṇau vara-dāḍimāni/

    āmrais @vada āśu %daśabhis kati dāḍimāni labhyāni tad-vinimayena @bhavanti mitra//

    nyāsas {btabular} 16 & 1 \\ 300 & 30 \\ 10 & * {etabular} labdhāni dāḍimāni 16// iti gaṇita-pāṭyām līlāvatyām prakīrṇakāni// Lil_89'
  source: source.gretil-lilavati
  review: unreviewed
