- id: verse.lilavati.83
  section: section.lilavati.prakirnaka
  ordinal: 74
  ref_label: '83'
  devanagari: 'मासे शतस्य यदि पञ्च कला-अन्तरम् स्यात् वर्षे गते भवति किम् वद षोडशानाम् ।

    कालम् तथा कथय मूल-कला-अन्तराभ्याम् मूलम् धनम् गणक काल-फले विदित्वा ॥'
  source_text: 'māse %śatasya yadi %pañca kalā-antaram @syāt varṣe gate @bhavati kim @vada %ṣoḍaśānām/

