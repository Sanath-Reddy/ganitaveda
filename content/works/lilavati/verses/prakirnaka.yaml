  source: source.gretil-lilavati
  review: unreviewed
- id: verse.lilavati.84
  section: section.lilavati.prakirnaka
  ordinal: 75
  ref_label: '84'
  devanagari: 'स-त्रि-अंश-मासेन शतस्य चेद् स्यात् कला-अन्तरम् पञ्च स-पञ्चम-अंशास् ।

    मासैस् त्रिभिस् पञ्च-लव-अधिकैस् तत् स-अर्ध-द्विषष्टेस् फलम् उच्यताम् किम् ॥'
  source_text: 'sa-%tri-aṃśa-māsena %śatasya ced @syāt kalā-antaram %pañca sa-%pañcama-aṃśās/

