  ordinal: 73
  ref_label: '82'
  devanagari: 'पञ्च-सप्त-नव-राशिक-आदिके अन्योन्य-पक्ष-नयनम् फल-छिदाम् ।

    संविधाय बहु-राशि-जे वधे सु-अल्प-राशि-वध-भाजिते फलम् ॥'
