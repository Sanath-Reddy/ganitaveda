- id: verse.lilavati.50
  section: section.lilavati.prakirnaka
  ordinal: 43
  ref_label: '50'
  devanagari: 'यस् त्रि-घ्नस् त्रिभिस् अन्वितस् स्व-चरणैस् भक्तस् ततस् सप्तभिस् स्व-त्रि-अंशेन विवर्जितस् स्व-गुणितस् हीनस् द्विपञ्चाशता ।

    तद्-मूले अष्ट-युते हृते च दशभिस् जातम् द्वयम् ब्रूहि तम् राशिम् वेत्सि हि चञ्चल-अक्षि विमलाम् बाले विलोम-क्रियाम् ॥'
  source_text: 'yas %tri-ghnas %tribhis anvitas sva-#caraṇais bhaktas tatas %saptabhis sva-%tri-aṃśena vivarjitas sva-guṇitas hīnas %dvipañcāśatā/

    tad-mūle %aṣṭa-yute hṛte ca %daśabhis jātam %dvayam @brūhi tam rāśim @vetsi hi cañcala-akṣi vimalām bāle viloma-kriyām// [śārdūlavikrīḍita] Lil_50'
  source: source.gretil-lilavati
  review: unreviewed
  notes:
  - śārdūlavikrīḍita
- id: verse.lilavati.51
  section: section.lilavati.prakirnaka
  ordinal: 44
  ref_label: '51'
  devanagari: 'उद्देशक-आलाप-वत् इष्ट-राशिस् क्षुण्णस् हृतस् अंशैस् रहितस् युतस् वा ।

    इष्ट-आहतम् दृष्टम् अनेन भक्तम् राशिस् भवेत् प्रोक्तम् इति इष्ट-कर्म ॥'
  source_text: 'uddeśaka-ālāpa-vat iṣṭa-rāśis kṣuṇṇas hṛtas aṃśais rahitas yutas vā/

    iṣṭa-āhatam dṛṣṭam anena bhaktam rāśis @bhavet proktam iti iṣṭa-karma// [indravajrā] Lil_51'
  source: source.gretil-lilavati
  review: unreviewed
  notes:
  - indravajrā
- id: verse.lilavati.52
  section: section.lilavati.prakirnaka
  ordinal: 45
  ref_label: '52'
  devanagari: 'पञ्च-घ्नस् स्व-त्रि-भाग-ऊनस् दश-भक्तस् समन्वितस् ।

    राशि-त्रि-अंश-अर्ध-पादैस् स्यात् कस् राशिस् द्वि-ऊन-सप्ततिस् ॥'
  source_text: '%pañca-ghnas sva-%tri-bhāga-ūnas %daśa-bhaktas samanvitas/

    rāśi-%tri-aṃśa-%ardha-pādais @syāt kas rāśis %dvi-ūna-%saptatis// [śloka] Lil_52'
  source: source.gretil-lilavati
  review: unreviewed
  notes:
  - śloka
- id: verse.lilavati.53
  section: section.lilavati.prakirnaka
  ordinal: 46
  ref_label: '53'
  devanagari: 'अमल-कमल-राशेस् त्रि-अंश-पञ्च-अंश-षष्ठैस् त्रि-नयन-हरि-सूर्यास् येन तुर्येण च आर्या ।

    गुरु-पदम् अथ षड्भिस् पूजितम् शेष-पद्मैस् सकल-कमल-संख्याम् क्षिप्रम् आख्याहि तस्य ॥'
  source_text: 'amala-kamala-rāśes %tri-aṃśa-%pañca-aṃśa-%ṣaṣṭhais %tri-nayana-hari-sūryās yena %turyeṇa ca āryā/

    guru-padam atha %ṣaḍbhis pūjitam śeṣa-padmais sakala-kamala-saṃkhyām kṣipram @ākhyāhi tasya// [mālinī] Lil_53'
  source: source.gretil-lilavati
  review: unreviewed
  notes:
  - mālinī
- id: verse.lilavati.54
  section: section.lilavati.prakirnaka
  ordinal: 47
  ref_label: '54'
  devanagari: 'स्व-अर्धम् प्रादात् प्रयागे नव-लव-युगलम् यस् अवशेषात् च काश्याम् शेष-अङ्घ्रिम् शुल्क-हेतोस् पथि दशम-लवान् षट् च शेषात् गयायाम् ।

    शिष्टास् निष्क-त्रिषष्टिस् निज-गृहम् अनया तीर्थ-पान्थस् प्रयातस् तस्य द्रव्य-प्रमाणम् वद यदि भवता शेष-जातिस् श्रुता अस्ति ॥'
  source_text: 'sva-%ardham @prādāt prayāge %nava-lava-#yugalam yas avaśeṣāt ca kāśyām śeṣa-#aṅghrim śulka-hetos pathi %daśama-lavān %ṣaṭ ca śeṣāt gayāyām/

    śiṣṭās niṣka-%triṣaṣṭis nija-gṛham anayā tīrtha-pānthas prayātas tasya dravya-pramāṇam @vada yadi bhavatā śeṣa-jātis śrutā @asti// [sragdharā] Lil_54'
  source: source.gretil-lilavati
  review: unreviewed
  notes:
  - sragdharā
- id: verse.lilavati.55
  section: section.lilavati.prakirnaka
  ordinal: 48
  ref_label: '55'
  devanagari: 'पञ्च-अंशस् अलि-कुलात् कदम्बम् अगमत् त्रि-अंशस् शिलीन्ध्रम् तयोस् विश्लेषस् त्रि-गुणस् मृग-अक्षि कुटजम् दोलायमानस् अपरस् ।

    कान्ते केतक-मालती-परिमल-प्राप्त-एक-काल-प्रिया-दूत-आहूतस् इतस् ततस् भ्रमति खे भृङ्गस् अलि-संख्याम् वद ॥'
  source_text: '%pañca-aṃśas ali-kulāt kadambam @agamat %tri-aṃśas śilīndhram tayos viśleṣas %tri-guṇas mṛga-akṣi kuṭajam dolāyamānas aparas/

    kānte ketaka-mālatī-parimala-prāpta-%eka-kāla-priyā-dūta-āhūtas itas tatas @bhramati khe bhṛṅgas ali-saṃkhyām @vada// [śārdūlavikrīḍita] Lil_55'
  source: source.gretil-lilavati
  review: unreviewed
  notes:
  - śārdūlavikrīḍita
- id: verse.lilavati.57
  section: section.lilavati.prakirnaka
  ordinal: 49
  ref_label: '57'
  devanagari: 'ययोस् योगस् शतम् स-एकम् वियोगस् पञ्चविंशतिस् ।

    तौ राशी वद मे वत्स वेत्सि संक्रमणम् यदि ॥'
  source_text: 'yayos yogas %śatam sa-%ekam viyogas %pañcaviṃśatis/

    tau rāśī @vada me vatsa @vetsi saṃkramaṇam yadi// [śloka] Lil_57'
  source: source.gretil-lilavati
  review: unreviewed
  notes:
  - śloka
- id: verse.lilavati.59
  section: section.lilavati.prakirnaka
  ordinal: 50
  ref_label: '59'
  devanagari: 'राश्योस् ययोस् वियोगस् अष्टौ तद्-कृत्योस् च चतुःशती ।

    विवरम् ब्रूहि तौ राशी शीघ्रम् गणित-कोविद ॥'
  source_text: 'rāśyos yayos viyogas %aṣṭau tad-kṛtyos ca %catuḥśatī/

    vivaram @brūhi tau rāśī śīghram gaṇita-kovida// [śloka] Lil_59'
  source: source.gretil-lilavati
  review: unreviewed
  notes:
  - śloka
- id: verse.lilavati.60
  section: section.lilavati.prakirnaka
  ordinal: 51
  ref_label: '60'
  devanagari: 'इष्ट-कृतिस् अष्ट-गुणिता वि-एका दलिता विभाजिता इष्टेन ।

    एकस् स्यात् अस्य कृतिस् दलिता स-एका अपरस् राशिस् ॥'
  source_text: 'iṣṭa-kṛtis %aṣṭa-guṇitā vi-%ekā dalitā vibhājitā iṣṭena/

    %ekas @syāt asya kṛtis dalitā sa-%ekā aparas rāśis// Lil_60'
  source: source.gretil-lilavati
  review: unreviewed
- id: verse.lilavati.61
  section: section.lilavati.prakirnaka
  ordinal: 52
  ref_label: '61'
  devanagari: 'रूपम् द्वि-गुण-इष्ट-हृतम् स-इष्टम् प्रथमस् अथ वा अपरस् रूपम् ।

    कृति-युति-वियुती वि-एके वर्गौ स्याताम् ययोस् राश्योस् ॥'
  source_text: '#rūpam %dvi-guṇa-iṣṭa-hṛtam sa-iṣṭam %prathamas atha vā aparas #rūpam/

    kṛti-yuti-viyutī vi-%eke vargau @syātām yayos rāśyos// Lil_61'
  source: source.gretil-lilavati
  review: unreviewed
- id: verse.lilavati.62
  section: section.lilavati.prakirnaka
  ordinal: 53
  ref_label: '62'
  devanagari: 'राश्योस् ययोस् कृति-वियोग-युती निस्-एके मूल-प्रदे प्रवद तौ मम मित्र यत्र ।

    क्लिश्यन्ति बीज-गणिते पटवस् अपि मूढास् षोढा-उक्त-बीज-गणितम् परिभावयन्तस् ॥'
  source_text: 'rāśyos yayos kṛti-viyoga-yutī nis-%eke mūla-prade @pravada tau mama mitra yatra/

    @kliśyanti bīja-gaṇite paṭavas api mūḍhās %ṣoḍhā-ukta-bīja-gaṇitam paribhāvayantas// Lil_62'
  source: source.gretil-lilavati
  review: unreviewed
- id: verse.lilavati.63
  section: section.lilavati.prakirnaka
  ordinal: 54
  ref_label: '63'
  devanagari: 'इष्टस्य वर्ग-वर्गस् घनस् च तौ अष्ट-संगुणौ प्रथमस् ।

    स-एकस् राशी स्याताम् एवम् व्यक्ते अथ वा अव्यक्ते ॥'
  source_text: 'iṣṭasya varga-vargas ghanas ca tau %aṣṭa-saṃguṇau %prathamas/

    sa-%ekas rāśī @syātām evam vyakte atha vā avyakte// Lil_63'
  source: source.gretil-lilavati
  review: unreviewed
- id: verse.lilavati.64
  section: section.lilavati.prakirnaka
  ordinal: 55
  ref_label: '64'
  devanagari: 'पाटी-सूत्र-उपमम् बीजम् गूढम् इति अवभासते ।

    न अस्ति गूढम् अमूढानाम् न एव षोढा इति अनेकधा ॥

    अस्ति त्रैराशिकम् पाटी बीजम् च विमला मतिस् ।

    किम् अज्ञातम् सु-बुद्धीनाम् अतस् मन्द-अर्थम् उच्यते ॥'
  source_text: 'pāṭī-sūtra-upamam bījam gūḍham iti @avabhāsate/

    na @asti gūḍham amūḍhānām na eva %ṣoḍhā iti anekadhā//

    @asti trairāśikam pāṭī bījam ca vimalā matis/

    kim ajñātam su-buddhīnām atas manda-artham @ucyate// Lil_64'
  source: source.gretil-lilavati
  review: unreviewed
- id: verse.lilavati.65
  section: section.lilavati.prakirnaka
  ordinal: 56
  ref_label: '65'
  devanagari: 'गुण-घ्न-मूल-ऊन-युतस्य राशेस् दृष्टस्य युक्तस्य गुण-अर्ध-कृत्या ।

    मूलम् गुण-अर्धेन युतम् विहीनम् वर्गी-कृतम् प्रष्टुर् अभीष्ट-राशिस् ॥'
  source_text: 'guṇa-ghna-mūla-ūna-yutasya rāśes dṛṣṭasya yuktasya guṇa-%ardha-kṛtyā/

    mūlam guṇa-%ardhena yutam vihīnam vargī-kṛtam praṣṭur abhīṣṭa-rāśis// Lil_65'
  source: source.gretil-lilavati
  review: unreviewed
- id: verse.lilavati.66
  section: section.lilavati.prakirnaka
  ordinal: 57
  ref_label: '66'
  devanagari: 'यदा लवैस् च ऊन-युतस् सस् राशिस् एकेन भाग-ऊन-युतेन भक्त्वा ।

    दृश्यम् तथा मूल-गुणम् च ताभ्याम् साध्यस् ततस् प्रोक्त-वत् एव राशिस् ॥'
  source_text: 'yadā lavais ca ūna-yutas sas rāśis %ekena bhāga-ūna-yutena @bhaktvā/

    dṛśyam tathā mūla-guṇam ca tābhyām sādhyas tatas prokta-vat eva rāśis// Lil_66'
  source: source.gretil-lilavati
  review: unreviewed
- id: verse.lilavati.67
  section: section.lilavati.prakirnaka
  ordinal: 58
  ref_label: '67'
  devanagari: 'बाले मराल-कुल-मूल-दलानि सप्त तीरे विलास-भर-मन्थर-गाणि अपश्यम् ।

    कुर्वत् च केलि-कलहम् कलहंस-युग्मम् शेषम् जले वद मराल-कुल-प्रमाणम् ॥'
  source_text: 'bāle marāla-kula-mūla-dalāni %sapta tīre vilāsa-bhara-manthara-gāṇi @apaśyam/

    kurvat ca keli-kalaham kalahaṃsa-#yugmam śeṣam jale @vada marāla-kula-pramāṇam// Lil_67'
  source: source.gretil-lilavati
  review: unreviewed
- id: verse.lilavati.68
  section: section.lilavati.prakirnaka
  ordinal: 59
  ref_label: '68'
  devanagari: 'स्व-पदैस् नवभिस् युक्तस् स्यात् चत्वारिंशता अधिकम् ।

    शत-द्वादशकम् विद्वन् कस् सस् राशिस् निगद्यताम् ॥'
  source_text: 'sva-padais %navabhis yuktas @syāt %catvāriṃśatā adhikam/

    %śata-%dvādaśakam vidvan kas sas rāśis @nigadyatām// Lil_68'
  source: source.gretil-lilavati
  review: unreviewed
- id: verse.lilavati.69
  section: section.lilavati.prakirnaka
  ordinal: 60
  ref_label: '69'
  devanagari: 'यातम् हंस-कुलस्य मूल-दशकम् मेघ-आगमे मानसम् प्रोड्डीय स्थल-पद्मिनी-वनम् अगात् अष्ट-अंशकस् अम्भस्-तटात् ।

    बाले बाल-मृणाल-शालिनि जले केलि-क्रिया-लालसम् दृष्टम् हंस-युग-त्रयम् च सकलाम् यूथस्य संख्याम् वद ॥'
  source_text: 'yātam haṃsa-kulasya mūla-%daśakam megha-āgame mānasam @proḍḍīya sthala-padminī-vanam @agāt %aṣṭa-aṃśakas ambhas-taṭāt/

    bāle bāla-mṛṇāla-śālini jale keli-kriyā-lālasam dṛṣṭam haṃsa-#yuga-%trayam ca sakalām yūthasya saṃkhyām @vada// Lil_69'
  source: source.gretil-lilavati
  review: unreviewed
- id: verse.lilavati.70
  section: section.lilavati.prakirnaka
  ordinal: 61
  ref_label: '70'
  devanagari: 'पार्थस् कर्ण-वधाय मार्गण-गणम् क्रुद्धस् रणे संदधे तस्य अर्धेन निवार्य तद्-शर-गणम् मूलैस् चतुर्भिस् हयान् ।

    शल्यम् षड्भिस् अथ इषुभिस् त्रिभिस् अपि छत्रम् ध्वजम् कार्मुकम् चिच्छेद अस्य शिरस् शरेण कति ते यान् अर्जुनस् संदधे ॥'
  source_text: 'pārthas karṇa-vadhāya mārgaṇa-gaṇam kruddhas raṇe @saṃdadhe tasya ardhena @nivārya tad-śara-gaṇam mūlais %caturbhis hayān/

    śalyam %ṣaḍbhis atha iṣubhis %tribhis api chatram dhvajam kārmukam @ciccheda asya śiras śareṇa kati te yān arjunas @saṃdadhe// Lil_70'
  source: source.gretil-lilavati
  review: unreviewed
- id: verse.lilavati.71
  section: section.lilavati.prakirnaka
  ordinal: 62
  ref_label: '71'
  devanagari: 'अलि-कुल-दल-मूलम् मालतीम् यातम् अष्टौ निखिल-नवम-भागास् चालिनी भृङ्गम् एकम् ।

    निशि परिमल-लुब्धम् पद्म-मध्ये निरुद्धम् प्रतिरणति रणन्तम् ब्रूहि कान्ते अलि-संख्याम् ॥'
  source_text: 'ali-kula-#dala-mūlam mālatīm yātam %aṣṭau nikhila-%navama-bhāgās cālinī bhṛṅgam %ekam/

    niśi parimala-lubdham padma-madhye niruddham @pratiraṇati raṇantam @brūhi kānte ali-saṃkhyām// Lil_71'
  source: source.gretil-lilavati
  review: unreviewed
- id: verse.lilavati.72
  section: section.lilavati.prakirnaka
  ordinal: 63
  ref_label: '72'
  devanagari: 'यस् राशिस् अष्टादशभिस् स्व-मूलैस् राशि-त्रि-भागेन समन्वितस् च ।

    जातम् शत-द्वादशकम् तम् आशु जानीहि पाट्याम् पटुता अस्ति ते चेद् ॥'
  source_text: 'yas rāśis %aṣṭādaśabhis sva-mūlais rāśi-%tri-bhāgena samanvitas ca/

    jātam %śata-%dvādaśakam tam āśu @jānīhi pāṭyām paṭutā @asti te ced// Lil_72'
