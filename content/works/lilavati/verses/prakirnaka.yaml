  section: section.lilavati.prakirnaka
  ordinal: 70
  ref_label: '79'
  devanagari: 'प्राप्नोति चेद् षोडश-वत्सरा स्त्री द्वात्रिंशतम् विंशति-वत्सरा किम् ।

