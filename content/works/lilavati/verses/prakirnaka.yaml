  ref_label: '49'
  devanagari: अंशस् तु अविकृतस् तत्र विलोमे शेषम् उक्त-वत् ॥
  source_text: aṃśas tu avikṛtas tatra vilome śeṣam ukta-vat// [śloka] Lil_49
