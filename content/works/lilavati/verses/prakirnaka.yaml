- id: verse.lilavati.48
  section: section.lilavati.prakirnaka
  ordinal: 41
  ref_label: '48'
  devanagari: 'छेदम् गुणम् गुणम् छेदम् वर्गम् मूलम् पदम् कृतिम् ।

    ऋणम् स्वम् स्वम् ऋणम् कुर्यात् दृश्ये राशि-प्रसिद्धये ॥'
  source_text: 'chedam guṇam guṇam chedam vargam mūlam padam kṛtim/

