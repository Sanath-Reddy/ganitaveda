- id: verse.lilavati.11
  section: section.lilavati.parikarma-astaka
  ordinal: 11
  ref_label: '11'
  devanagari: 'जलधिस् च अन्त्यम् मध्यम् परार्धम् इति दश-गुण-उत्तरास् संज्ञास् ।

    संख्यायास् स्थानानाम् व्यवहार-अर्थम् कृतास् पूर्वैस् ॥'
  source_text: '%jaladhis ca %antyam %madhyam %parārdham iti %daśa-guṇa-uttarās saṃjñās/

    saṃkhyāyās sthānānām vyavahāra-artham kṛtās pūrvais//[āryā] Lil_11'
