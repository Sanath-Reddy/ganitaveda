- id: verse.lilavati.141
  section: section.lilavati.ksetra-vyavahara
  ordinal: 128
  ref_label: '141'
  devanagari: 'इष्टस् भुजस् अस्मात् द्वि-गुण-इष्ट-निघ्नात् इष्टस्य कृत्या एक-वियुक्तया आप्तम् ।

    कोटिस् पृथक् सा इष्ट-गुणा भुज-ऊना कर्णस् भवेत् त्रि-अस्रम् इदम् तु जात्यम् ॥'
  source_text: 'iṣṭas bhujas asmāt %dvi-guṇa-iṣṭa-nighnāt iṣṭasya kṛtyā %eka-viyuktayā āptam/

