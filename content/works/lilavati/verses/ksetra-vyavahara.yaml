    त्रि-अस्रे चतुर्-अस्रे वा सा कोटिस् कीर्तिता तद्-ज्ञैस् ॥'
  source_text: 'iṣṭas bāhus yas @syāt tad-spardhinyām diśi itaras bāhus/

