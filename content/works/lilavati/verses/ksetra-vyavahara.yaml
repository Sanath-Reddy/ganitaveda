- id: verse.lilavati.171
  section: section.lilavati.ksetra-vyavahara
  ordinal: 158
  ref_label: '171'
  devanagari: 'चतुर्-भुजस्य अनियतौ हि कर्णौ कथम् ततस् अस्मिन् नियतम् फलम् स्यात् ।

    प्रसाधितौ तद्-श्रवणौ यत् आद्यैस् स्व-कल्पितौ तौ इतरत्र न स्तस् ।

    तेषु एव बाहुषु अपरौ च कर्णौ अनेकधा क्षेत्र-फलम् ततस् च ॥

    चतुर्-भुजे हि एक-अन्तर-कोणौ आक्रम्य अन्तर्-प्रवेश्यमानौ भुजौ तद्-संसक्तम् स्व-कर्णम् संकोचयतस् । इतरौ तु बहिस्-प्रसरन्तौ स्व-कर्णम् वर्धयतस् । अतस् उक्तम् तेषु एव बाहुषु अपरौ च कर्णौ इति ॥

    लम्बयोस् कर्णयोस् वा एकम् अनिर्दिश्य अपरम् कथम् ।

    पृच्छति अनियतत्वे अपि नियतम् च अपि तद्-फलम् ॥

    सस् पृच्छकस् पिशाचस् वा वक्ता वा नितराम् ततस् ।

    यस् न वेत्ति चतुर्-बाहु-क्षेत्रस्य अनियताम् स्थितिम् ॥

    सम-चतुर्-भुज-आयतयोस् फल-आनयने करण-सूत्रम् स-अर्ध-श्लोक-द्वयम् ।'
  source_text: '%catur-bhujasya aniyatau hi karṇau katham tatas asmin niyatam phalam @syāt/

    prasādhitau tad-śravaṇau yat ādyais sva-kalpitau tau itaratra na @stas/

    teṣu eva bāhuṣu aparau ca karṇau anekadhā kṣetra-phalam tatas ca//

    %catur-bhuje hi %eka-antara-koṇau @ākramya antar-praveśyamānau bhujau tad-saṃsaktam sva-karṇam @saṃkocayatas/ itarau tu bahis-prasarantau sva-karṇam @vardhayatas/ atas uktam teṣu eva bāhuṣu aparau ca karṇau iti//

    lambayos karṇayos vā %ekam @anirdiśya aparam katham/

    @pṛcchati aniyatatve api niyatam ca api tad-phalam//

    sas pṛcchakas piśācas vā vaktā vā nitarām tatas/

    yas na @vetti %catur-bāhu-kṣetrasya aniyatām sthitim// [no numbers are given to these two śloka stanśas in āpaṭe.]

    sama-catur-bhuja-āyatayos phala-ānayane karaṇa-sūtram sa-ardha-śloka-dvayam/ Lil_171'
  source: source.gretil-lilavati
  review: unreviewed
  notes:
  - no numbers are given to these two śloka stanśas in āpaṭe.
