- id: verse.lilavati.149
  section: section.lilavati.ksetra-vyavahara
  ordinal: 136
  ref_label: '149'
  devanagari: 'वंश-अग्र-मूल-अन्तर-भूमि-वर्गस् वंश-उद्धृतस् तेन पृथक् युत-ऊनौ ।

    वंशौ तद्-अर्धे भवतस् क्रमेण वंशस्य खण्डे श्रुति-कोटि-रूपे ॥'
  source_text: 'vaṃśa-agra-mūla-antara-bhūmi-vargas vaṃśa-uddhṛtas tena pṛthak yuta-ūnau/ [āpaṭe: -uddhṛtes < -uddhṛtas]

