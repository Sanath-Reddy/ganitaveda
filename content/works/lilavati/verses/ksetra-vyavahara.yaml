- id: verse.lilavati.136
  section: section.lilavati.ksetra-vyavahara
  ordinal: 123
  ref_label: '136'
  devanagari: 'तद्-कृत्योस् योग-पदम् कर्णस् दोस्-कर्ण-वर्गयोस् विवरात् ।

