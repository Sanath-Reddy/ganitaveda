  ordinal: 133
  ref_label: '146'
  devanagari: 'इष्ट-वर्गेण स-एकेन द्वि-घ्नस् कर्णस् अथ वा हतस् ।

    फल-ऊनस् श्रवणस् कोटिस् फलम् इष्ट-गुणम् भुजस् ॥'
  source_text: 'iṣṭa-vargeṇa sa-%ekena %dvi-ghnas karṇas atha vā hatas/

