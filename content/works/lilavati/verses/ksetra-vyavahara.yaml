- id: verse.lilavati.150
  section: section.lilavati.ksetra-vyavahara
  ordinal: 137
  ref_label: '150'
  devanagari: 'यदि सम-भुवि वेणुस् द्वि-त्रि-पाणि-प्रमाणस् गणक पवन-वेगात् एक-देशे सस् भग्नस् ।

    भुवि नृप-मित-हस्तेषु अङ्ग लग्नम् तद्-अग्रम् कथय कतिषु मूलात् एषस् भग्नस् करेषु ॥'
  source_text: 'yadi sama-bhuvi veṇus %dvi-%tri-pāṇi-pramāṇas gaṇaka pavana-vegāt %eka-deśe sas bhagnas/

    bhuvi nṛpa-mita-hasteṣu aṅga lagnam tad-agram @kathaya katiṣu mūlāt eṣas bhagnas kareṣu// Lil_150'
  source: source.gretil-lilavati
  review: unreviewed
- id: verse.lilavati.151
  section: section.lilavati.ksetra-vyavahara
  ordinal: 138
  ref_label: '151'
  devanagari: 'स्तम्भस्य वर्गस् अहि-बिल-अन्तरेण भक्तस् फलम् व्याल-बिल-अन्तरालात् ।

    शोध्यम् तद्-अर्ध-प्रमितैस् करैस् स्यात् बिल-अग्रतस् व्याल-कलापि-योगस् ॥'
  source_text: 'stambhasya vargas ahi-bila-antareṇa bhaktas phalam vyāla-bila-antarālāt/

    śodhyam tad-%ardha-pramitais karais @syāt bila-agratas vyāla-kalāpi-yogas// Lil_151'
  source: source.gretil-lilavati
  review: unreviewed
- id: verse.lilavati.152
  section: section.lilavati.ksetra-vyavahara
  ordinal: 139
  ref_label: '152'
  devanagari: 'अस्ति स्तम्भ-तले बिलम् तद्-उपरि क्रीडा-शिखण्डी स्थितस् ।

    स्तम्भे हस्त-नव-उच्छ्रिते त्रि-गुणिते स्तम्भ-प्रमाण-अन्तरे ।

    दृष्ट्वा अहिम् बिलम् आव्रजन्तम् अपतत् तिर्यक् सस् तस्य उपरि ।

    क्षिप्रम् ब्रूहि तयोस् बिलात् कति-करैस् साम्येन गत्योस् युतिस् ॥'
  source_text: '@asti stambha-tale bilam tad-upari krīḍā-śikhaṇḍī sthitas/

    stambhe hasta-%nava-ucchrite %tri-guṇite stambha-pramāṇa-antare/

    dṛṣṭvā ahim bilam āvrajantam @apatat tiryak sas tasya upari/

    kṣipram @brūhi tayos bilāt kati-karais sāmyena gatyos yutis// Lil_152'
  source: source.gretil-lilavati
  review: unreviewed
- id: verse.lilavati.153
  section: section.lilavati.ksetra-vyavahara
  ordinal: 140
  ref_label: '153'
  devanagari: 'भुजात् वर्गितात् कोटि-कर्ण-अन्तर-आप्तम् द्विधा कोटि-कर्ण-अन्तरेण ऊन-युक्तम् ।

    तद्-अर्धे क्रमात् कोटि-कर्णौ भवेताम् इदम् धीमता आवेद्य सर्वत्र योज्यम् ॥'
  source_text: 'bhujāt vargitāt koṭi-karṇa-antara-āptam dvidhā koṭi-karṇa-antareṇa ūna-yuktam/

    tad-%ardhe kramāt koṭi-karṇau bhavetām idam dhīmatā @āvedya sarvatra yojyam// Lil_153'
  source: source.gretil-lilavati
  review: unreviewed
- id: verse.lilavati.154
  section: section.lilavati.ksetra-vyavahara
  ordinal: 141
  ref_label: '154'
  devanagari: 'सखे पद्म-तद्-मज्जन-स्थान-मध्यम् भुजस् कोटि-कर्ण-अन्तरम् पद्म-दृश्यम् ।

    नलस् कोटिस् एतद्-मितम् स्यात् यत् अम्भस् वद एवम् समानीय पानीय-मानम् ॥'
  source_text: 'sakhe padma-tad-majjana-sthāna-madhyam bhujas koṭi-karṇa-antaram padma-dṛśyam/

    nalas koṭis etad-mitam @syāt yat ambhas @vada evam @samānīya pānīya-mānam// Lil_154'
  source: source.gretil-lilavati
  review: unreviewed
- id: verse.lilavati.155
  section: section.lilavati.ksetra-vyavahara
  ordinal: 142
  ref_label: '155'
  devanagari: 'चक्र-क्रौञ्च-आकुलित-सलिले क्व अपि दृष्टम् तडागे तोयात् ऊर्ध्वम् कमल-कलिका-अग्रम् वितस्ति-प्रमाणम् ।

    मन्दम् मन्दम् चलितम् अनिलेन आहतम् हस्त-युग्मे तस्मिन् मग्नम् गणक कथय क्षिप्रम् अम्भस्-प्रमाणम् ॥'
  source_text: 'cakra-krauñca-ākulita-salile kva api dṛṣṭam taḍāge toyāt ūrdhvam kamala-kalikā-agram vitasti-pramāṇam/

    mandam mandam calitam anilena āhatam hasta-#yugme tasmin magnam gaṇaka @kathaya kṣipram ambhas-pramāṇam// Lil_155'
  source: source.gretil-lilavati
  review: unreviewed
- id: verse.lilavati.156
  section: section.lilavati.ksetra-vyavahara
  ordinal: 143
  ref_label: '156'
  devanagari: 'द्वि-निघ्न-ताल-उच्छ्रिति-संयुतम् यत् सरस्-अन्तरम् तेन विभाजितायास् ।

    ताल-उच्छ्रितेस् ताल-सरस्-अन्तर-घ्न्यास् उड्डीन-मानम् खलु लभ्यते तत् ॥'
  source_text: '%dvi-nighna-tāla-ucchriti-saṃyutam yat saras-antaram tena vibhājitāyās/

    tāla-ucchrites tāla-saras-antara-ghnyās uḍḍīna-mānam khalu @labhyate tat// [āpaṭe: khala < khalu] Lil_156'
  source: source.gretil-lilavati
  review: unreviewed
  notes:
  - 'āpaṭe: khala < khalu'
- id: verse.lilavati.157
  section: section.lilavati.ksetra-vyavahara
  ordinal: 144
  ref_label: '157'
  devanagari: 'वृक्षात् हस्त-शत-उच्छ्रयात् शत-युगे वापीम् कपिस् कस् अपि अगात् उत्तीर्य अथ परस् द्रुतम् श्रुति-पथेन उड्डीय किम्चित् द्रुमात् ।

    जाता एवम् समता तयोस् यदि गतौ उड्डीन-मानम् कियत् विद्वन् चेद् सु-परिश्रमस् अस्ति गणिते क्षिप्रम् तत् आचक्ष्व मे ॥'
  source_text: 'vṛkṣāt hasta-%śata-ucchrayāt %śata-#yuge vāpīm kapis kas api @agāt @uttīrya atha paras drutam śruti-pathena @uḍḍīya kimcit drumāt/

    jātā evam samatā tayos yadi gatau uḍḍīna-mānam kiyat vidvan ced su-pariśramas @asti gaṇite kṣipram tat @ācakṣva me// Lil_157'
  source: source.gretil-lilavati
  review: unreviewed
- id: verse.lilavati.158
  section: section.lilavati.ksetra-vyavahara
  ordinal: 145
  ref_label: '158'
  devanagari: 'कर्णस्य वर्गात् द्वि-गुणात् विशोध्यस् दोस्-कोटि-योगस् स्व-गुणस् अस्य मूलम् ।

    योगस् द्विधा मूल-विहीन-युक्तस् स्याताम् तद्-अर्धे भुज-कोटि-माने ॥'
  source_text: 'karṇasya vargāt %dvi-guṇāt viśodhyas dos-koṭi-yogas sva-guṇas asya mūlam/

    yogas dvidhā mūla-vihīna-yuktas @syātām tad-%ardhe bhuja-koṭi-māne// Lil_158'
  source: source.gretil-lilavati
  review: unreviewed
- id: verse.lilavati.159
  section: section.lilavati.ksetra-vyavahara
  ordinal: 146
  ref_label: '159'
  devanagari: 'दश सप्त-अधिकस् कर्णस् त्रि-अधिका विंशतिस् सखे ।

