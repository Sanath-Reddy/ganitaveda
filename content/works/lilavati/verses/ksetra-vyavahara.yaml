  review: unreviewed
- id: verse.lilavati.138
  section: section.lilavati.ksetra-vyavahara
  ordinal: 125
  ref_label: '138'
  devanagari: 'राश्योस् अन्तर-वर्गेण द्वि-घ्ने घाते युते तयोस् ।

