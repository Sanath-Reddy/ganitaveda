    साध्यस् अवलम्बस् अथ तथा अन्य-कर्णस् स्व-उर्व्यास् कथम्-चित् श्रवणस् न दीर्घस् ।

    तद्-अन्य-लम्बात् न लघुस् तथा इदम् ज्ञात्वा इष्ट-कर्णस् सुधिया प्रकल्प्यस् ॥'
