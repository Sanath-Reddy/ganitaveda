  review: unreviewed
- id: verse.lilavati.142
  section: section.lilavati.ksetra-vyavahara
  ordinal: 129
  ref_label: '142'
  devanagari: 'इष्टस् भुजस् तद्-कृतिस् इष्ट-भक्ता द्विस् स्थापिता इष्ट-ऊन-युता अर्धिता वा ।

    तौ कोटि-कर्णौ इति कोटितस् वा बाहु-श्रुती वा अकरणी-गते स्तस् ॥'
  source_text: 'iṣṭas bhujas tad-kṛtis iṣṭa-bhaktā %dvis sthāpitā iṣṭa-ūna-yutā ardhitā vā/

    tau koṭi-karṇau iti koṭitas vā bāhu-śrutī vā akaraṇī-gate @stas// Lil_142'
  source: source.gretil-lilavati
  review: unreviewed
- id: verse.lilavati.143
  section: section.lilavati.ksetra-vyavahara
  ordinal: 130
  ref_label: '143'
