- id: verse.lilavati.261
  section: section.lilavati.anka-pasa
  ordinal: 241
  ref_label: '261'
  devanagari: 'स्थान-अन्तम् एक-आदि-चय-अङ्क-घातस् संख्या-विभेदास् नियतैस् स्युस् अङ्कैस् ।

    भक्तस् अङ्क-मित्या अङ्क-समास-निघ्नस् स्थानेषु युक्तस् मिति-संयुतिस् स्यात् ॥'
  source_text: 'sthāna-antam %eka-ādi-caya-aṅka-ghātas saṃkhyā-vibhedās niyatais @syus aṅkais/

    bhaktas aṅka-mityā aṅka-samāsa-nighnas sthāneṣu yuktas miti-saṃyutis @syāt// Lil_261'
  source: source.gretil-lilavati
  review: unreviewed
- id: verse.lilavati.262
  section: section.lilavati.anka-pasa
  ordinal: 242
  ref_label: '262'
  devanagari: 'द्विक-अष्टकाभ्याम् त्रि-नव-अष्टकैस् वा निरन्तरम् द्वि-आदि-नव-अवसानैस् ।

    संख्या-विभेदास् कति संभवन्ति तद्-संख्यक-ऐक्यानि पृथक् वद आशु ॥'
  source_text: '%dvika-%aṣṭakābhyām %tri-%nava-%aṣṭakais vā nirantaram %dvi-ādi-%nava-avasānais/

    saṃkhyā-vibhedās kati @saṃbhavanti tad-saṃkhyaka-aikyāni pṛthak @vada āśu// Lil_262'
  source: source.gretil-lilavati
  review: unreviewed
- id: verse.lilavati.263
  section: section.lilavati.anka-pasa
  ordinal: 243
  ref_label: '263'
  devanagari: 'पाश-अङ्कुश-अहि-डमरूक-कपाल-शूलैस् खट्वा-अङ्ग-शक्ति-शर-चाप-युतैस् भवन्ति ।

    अन्योन्य-हस्त-कलितैस् कति मूर्ति-भेदास् शंभोस् हरेस् इव गदा-अरि-सरस्-ज-शङ्खैस् ॥'
  source_text: 'pāśa-aṅkuśa-ahi-ḍamarūka-kapāla-śūlais khaṭvā-aṅga-śakti-śara-cāpa-yutais @bhavanti/

    anyonya-hasta-kalitais kati mūrti-bhedās śaṃbhos hares iva gadā-ari-saras-ja-śaṅkhais// Lil_263'
  source: source.gretil-lilavati
  review: unreviewed
- id: verse.lilavati.264
  section: section.lilavati.anka-pasa
  ordinal: 244
  ref_label: '264'
  devanagari: 'यावत्-स्थानेषु तुल्य-अङ्कास् तद्-भेदैस् तु पृथक् कृतैस् ।

    प्राक्-भेदास् विहृतास् भेदास् तद्-संख्या-ऐक्यम् च पूर्व-वत् ॥'
  source_text: 'yāvat-sthāneṣu tulya-aṅkās tad-bhedais tu pṛthak kṛtais/

    prāk-bhedās vihṛtās bhedās tad-saṃkhyā-aikyam ca pūrva-vat// Lil_264'
  source: source.gretil-lilavati
  review: unreviewed
- id: verse.lilavati.265
  section: section.lilavati.anka-pasa
  ordinal: 245
  ref_label: '265'
  devanagari: 'द्वि-द्वि-एक-भू-परिमितैस् कति संख्यकास् स्युस् तासाम् युतिस् च गणक आशु मम प्रचक्ष्व ।

    अम्भोधि-कुम्भि-शर-भूत-शरैस् तथा अङ्कैस् चेद् अङ्क-पाशम् इति युक्ति-विशारदस् असि ॥'
  source_text: '%dvi-%dvi-%eka-#bhū-parimitais kati saṃkhyakās @syus tāsām yutis ca gaṇaka āśu mama @pracakṣva/

    #ambhodhi-#kumbhi-#śara-#bhūta-#śarais tathā aṅkais ced aṅka-pāśam iti yukti-viśāradas @asi// Lil_265'
  source: source.gretil-lilavati
  review: unreviewed
- id: verse.lilavati.267
  section: section.lilavati.anka-pasa
  ordinal: 246
  ref_label: '267'
  devanagari: 'स्थान-षट्क-स्थितैस् अङ्कैस् अन्योन्यम् खेन वर्जितैस् ।

    कति संख्या-विभेदास् स्युस् यदि वेत्सि निगद्यताम् ॥'
  source_text: 'sthāna-%ṣaṭka-sthitais aṅkais anyonyam #khena varjitais/

    kati saṃkhyā-vibhedās @syus yadi @vetsi @nigadyatām// Lil_267'
  source: source.gretil-lilavati
  review: unreviewed
- id: verse.lilavati.268
  section: section.lilavati.anka-pasa
  ordinal: 247
  ref_label: '268'
  devanagari: 'निस्-एकम् अङ्क-ऐक्यम् इदम् निस्-एक-स्थान-अन्तम् एक-अपचितम् विभक्तम् ।

    रूप-आदिभिस् तद्-निहतैस् समास् स्युस् संख्या-विभेदास् नियते अङ्क-योगे ॥'
  source_text: 'nis-%ekam aṅka-aikyam idam nis-%eka-sthāna-antam %eka-apacitam vibhaktam/

    #rūpa-ādibhis tad-nihatais samās @syus saṃkhyā-vibhedās niyate aṅka-yoge// Lil_268'
  source: source.gretil-lilavati
  review: unreviewed
- id: verse.lilavati.269
  section: section.lilavati.anka-pasa
  ordinal: 248
  ref_label: '269'
  devanagari: नव-अन्वित-स्थानक-संख्यकायास् ऊने अङ्क-योगे कथितम् तु वेद्यम् ।
  source_text: '%nava-anvita-sthānaka-saṃkhyakāyās ūne aṅka-yoge kathitam tu vedyam/ Lil_269'
  source: source.gretil-lilavati
  review: unreviewed
- id: verse.lilavati.270
  section: section.lilavati.anka-pasa
  ordinal: 249
  ref_label: '270'
  devanagari: 'पञ्च-स्थान-स्थितैस् अङ्कैस् यद्-यद्-योगस् त्रयोदश ।

    कति-भेदा भवेत् संख्या यदि वेत्सि निगद्यताम् ॥'
  source_text: '%pañca-sthāna-sthitais aṅkais yad-yad-yogas %trayodaśa/

    kati-bhedā @bhavet saṃkhyā yadi @vetsi @nigadyatām// Lil_270'
  source: source.gretil-lilavati
  review: unreviewed
- id: verse.lilavati.271
  section: section.lilavati.anka-pasa
  ordinal: 250
  ref_label: '271'
  devanagari: 'न गुणस् न हरस् न कृतिस् न घनस् पृष्टस् तथा अपि दुष्टानाम् ।

    गर्वित-गणक-बटूनाम् स्यात् पातस् अवश्यम् अङ्क-पाशे अस्मिन् ॥'
  source_text: 'na guṇas na haras na kṛtis na ghanas pṛṣṭas tathā api duṣṭānām/

    garvita-gaṇaka-baṭūnām @syāt pātas avaśyam aṅka-pāśe asmin// Lil_271'
  source: source.gretil-lilavati
  review: unreviewed
