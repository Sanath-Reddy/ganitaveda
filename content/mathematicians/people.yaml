# Mathematicians (plan §4.4, §7.6). No portraits: a person is shown as a seal.
# Dates are ranges; `dates_label` is what readers see. Every date and every
# teacher–student link cites a source; pages are pinned by the reviewer.
places:
  - id: place.kusumapura
    name: {en: "Kusumapura (Pāṭaliputra, near Patna)", kn: "ಕುಸುಮಪುರ (ಪಾಟಲೀಪುತ್ರ, ಪಾಟ್ನಾ ಬಳಿ)"}
    lat: 25.61
    lon: 85.14
  - id: place.bhillamala
    name: {en: "Bhillamāla (Bhinmal, Rajasthan)", kn: "ಭಿಲ್ಲಮಾಲ (ಭಿನ್ಮಾಲ್, ರಾಜಸ್ಥಾನ)"}
    lat: 25.0
    lon: 72.25
  - id: place.sangamagrama
    name: {en: "Saṅgamagrāma (Irinjalakuda, Kerala)", kn: "ಸಂಗಮಗ್ರಾಮ (ಇರಿಂಜಾಲಕುಡ, ಕೇರಳ)"}
    lat: 10.34
    lon: 76.21
  - id: place.kerala
    name: {en: "Central Kerala", kn: "ಮಧ್ಯ ಕೇರಳ"}
