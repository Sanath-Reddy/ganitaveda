about:
  en: "Henry Thomas Colebrooke (1765–1837) translated the Līlāvatī, Bhāskara's algebra and two chapters of Brahmagupta in one volume, London, 1817. His paragraph numbers differ slightly from the Sanskrit edition used here; the verse number shown is the Sanskrit one."
  kn: "ಹೆನ್ರಿ ಥಾಮಸ್ ಕೋಲ್‌ಬ್ರೂಕ್ (1765–1837) ಲೀಲಾವತೀ, ಭಾಸ್ಕರನ ಬೀಜಗಣಿತ ಮತ್ತು ಬ್ರಹ್ಮಗುಪ್ತನ ಎರಡು ಅಧ್ಯಾಯಗಳನ್ನು ಒಂದೇ ಸಂಪುಟದಲ್ಲಿ ಅನುವಾದಿಸಿದರು (ಲಂಡನ್, 1817). ಅವರ ಪರಿಚ್ಛೇದ ಸಂಖ್ಯೆಗಳು ಇಲ್ಲಿ ಬಳಸಿದ ಸಂಸ್ಕೃತ ಆವೃತ್ತಿಗಿಂತ ಸ್ವಲ್ಪ ಬೇರೆ; ತೋರಿಸುವ ಪದ್ಯ ಸಂಖ್ಯೆ ಸಂಸ್ಕೃತದ್ದು."
style_note:
  en: "Formal 19th-century English with old spellings of Sanskrit words (Cadamba, Silind'hri). Tap a highlighted word for a note."
  kn: "19ನೇ ಶತಮಾನದ ಔಪಚಾರಿಕ ಇಂಗ್ಲಿಷ್; ಸಂಸ್ಕೃತ ಪದಗಳ ಹಳೆಯ ಕಾಗುಣಿತ (Cadamba, Silind'hri). ಗುರುತಿಸಿದ ಪದವನ್ನು ಒತ್ತಿದರೆ ಟಿಪ್ಪಣಿ ಕಾಣುತ್ತದೆ."
