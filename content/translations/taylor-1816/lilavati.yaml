# From the Internet Archive OCR of the 1816 Bombay edition (Google Books scan,
# bub_gb_tsTSzyC7WbIC). The OCR is rough: obvious letter errors are fixed
# (fljing, diflbrence...), and [square brackets] mark words restored where the
# scan is unreadable. Everything stays `ocr-draft` until proofread against the
# page images. Passages with unreadable numbers are left out rather than guessed
# (the alms example's total is printed 583 in the OCR; the sum is 585).
translation: translation.taylor-1816
work: work.lilavati
segments:
  - id: seg.taylor-1816.lilavati.supposition-bees
    label: "Section V, where there is the difference"
    verses: [verse.lilavati.55]
    page: 34
    status: ocr-draft
    glossary: [gloss.arbour]
    text: "Example. One fifth of a hive of bees flew to the Kadamba flower; one third flew to the Silandhara; three times the difference of these two numbers flew to an arbour; and one bee continued flying about, attracted on each side by the fragrant Ketaki and the Malati. What was the number of bees? The number of bees is 15."
  - id: seg.taylor-1816.lilavati.three-rule
    label: "Section VI, rule of three quantities"
    verses: [verse.lilavati.73]
    page: 41
    status: ocr-draft
    glossary: [gloss.quantities]
    text: "The quantity whose product is given, and the quantity whose product is demanded, must be of the same denomination, and the first and last terms; the given product is of a different denomination and the middle term. Multiply the middle term by the quantity whose product is demanded, and divide the product thus obtained by the first term; the quotient will be the required product. In inversion operate according to the rule of inversion."
  - id: seg.taylor-1816.lilavati.three-saffron
    label: "Section VI, first example"
    verses: [verse.lilavati.74]
    page: 41
    status: ocr-draft
    glossary: [gloss.pala, gloss.nishca]
    text: "Example. Two palas and a half of saffron are purchased for three sevenths of a Niska: how many will be purchased for nine Niskas?"
  - id: seg.taylor-1816.lilavati.progression-rule
    label: "Of progressions, rule"
    verses: [verse.lilavati.121]
    page: 61
    status: ocr-draft
    glossary: [gloss.mean-term]
    text: "Rule. Multiply the difference by the number of terms minus one, and to the product add the first term; the result is the last term. To the last term add the first term, and halve the result; this gives the mean term. Multiply the mean term by the number of terms; this gives the sum."
  - id: seg.taylor-1816.lilavati.progression-alms
    label: "Of progressions, first example"
    verses: [verse.lilavati.122]
    page: 61
    status: ocr-draft
    glossary: [gloss.dramma]
    text: "Example. The first day four drammas were given to a brahman, and this sum was increased by five each day. How many drammas were given in fifteen days?"
  - id: seg.taylor-1816.lilavati.geometry-hypotenuse
    label: "Part II, of geometrical operations, rule"
    verses: [verse.lilavati.136]
    page: "to confirm"
    status: ocr-draft
    glossary: [gloss.hypothenuse]
    text: "The root of the sum of the squares of the base and side is equal to the hypothenuse. The root of the difference of the squares of the base and hypothenuse is equal to the side. [The root of] the difference of the squares of the side and hypothenuse [is] equal [to the base]."
  - id: seg.taylor-1816.lilavati.geometry-example
    label: "Part II, of geometrical operations, example"
    verses: [verse.lilavati.137]
    page: "to confirm"
    status: ocr-draft
    glossary: [gloss.hypothenuse]
    text: "Example. The side is four, and the base three; required the hypothenuse; the [base] and hypothenuse being given, required the side; and the side and hypothenuse given, required the base?"
  # Chapter I, the opening operations (OCR clean enough here; square-root results are garbled and left out).
  - id: seg.taylor-1816.lilavati.addition
    label: "Section I, addition and subtraction"
    verses: [verse.lilavati.13]
    page: 6
    status: ocr-draft
    text: "Figures are added from right to left, or from left to right; and also are subtracted from right to left, or from left to right, according to their places. Example. Tell me the sum of two, five, thirty-two, one hundred and ninety-three, eighteen, ten, and one hundred? Also what is the result if this sum be subtracted from ten thousand? The sum is 360, and the remainder is 9640."
  - id: seg.taylor-1816.lilavati.multiplication
    label: "Section II, multiplication, example"
    verses: [verse.lilavati.17]
    page: "to confirm"
    status: ocr-draft
    text: "Example. If thou art acquainted with the method of multiplying by the multiplier itself, or by component parts of the multiplier, or by submultiples of the multiplier, or by the places of the multiplier, then tell me, my young girl whose tremulous eyes resemble those of a young fawn, what is the product of one hundred and thirty-five multiplied by twelve?"
  - id: seg.taylor-1816.lilavati.square-rule
    label: "Of squares, rule"
    verses: [verse.lilavati.20]
    page: "to confirm"
    status: ocr-draft
    text: "Having diminished the quantity and also increased it by any number you choose, multiply the results together, and to the product add the square of the number chosen. The sum is the square of the quantity."
  - id: seg.taylor-1816.lilavati.square-example
    label: "Of squares, example"
    verses: [verse.lilavati.21]
    page: "to confirm"
    status: ocr-draft
    text: "Example. What are the squares of 9, 14, 297, 10005?"
  - id: seg.taylor-1816.lilavati.cubes
    label: "Of cubes, example"
    verses: [verse.lilavati.27]
    page: "to confirm"
    status: ocr-draft
    text: "Example. What are the cubes of 9, 27, and 125? The cubes of these numbers in succession are 729, 19683, 1953125."
  # Chapter II, fractions. Numerals are garbled in the OCR, so only examples written out in words are used.
  - id: seg.taylor-1816.lilavati.fractions-equivalent
    label: "Of fractions, equivalent fractions, example"
    verses: [verse.lilavati.35]
    page: 26
    status: ocr-draft
    text: "Example. What are the equivalent fractions of two plus one fourth? Also of three minus one fourth?"
  - id: seg.taylor-1816.lilavati.fractions-of-remainder
    label: "Of fractions, fractions of a result, example"
    verses: [verse.lilavati.36]
    page: 26
    status: ocr-draft
    text: "Example. What is one fourth plus one third of itself, plus one half of the result? What are two thirds minus one eighth of itself, minus three sevenths of the remainder? What is one half minus one eighth of itself, plus nine sevenths of the remainder?"
  - id: seg.taylor-1816.lilavati.fractions-sum
    label: "Of fractions, addition, example"
    verses: [verse.lilavati.38]
    page: "to confirm"
    status: ocr-draft
    text: "Example. What is the sum of one fifth, one fourth, one third, one half, and one sixth added together? And their sum being subtracted from three, what is the remainder?"
  - id: seg.taylor-1816.lilavati.inversion
    label: "Of inversion, example"
    verses: [verse.lilavati.50]
    page: "to confirm"
    status: ocr-draft
    text: "Example. A quantity is multiplied by three; to the product there is added the fourth of itself multiplied by three; and this last product is divided by seven; the quotient minus one third of itself is squared, and fifty-two being subtracted from the square, to the square root of the remainder eight is added; the sum is then divided by ten, and there is obtained the quotient two. What is the quantity?"
