id: translation.clark-1930
translator: W. E. Clark
year: 1930
language: en
kind: scholarly
licence: licence.public-domain-unconfirmed
source: source.clark-1930
works: [work.aryabhatiya]
about:
  en: "Walter Eugene Clark (1881–1960), a Sanskritist at Harvard, translated the whole Āryabhaṭīya with notes in 1930. He marks some readings as uncertain, and words in round brackets are his own additions."
  kn: "ಹಾರ್ವರ್ಡ್‌ನ ಸಂಸ್ಕೃತ ವಿದ್ವಾಂಸ ವಾಲ್ಟರ್ ಯೂಜೀನ್ ಕ್ಲಾರ್ಕ್ (1881–1960) 1930ರಲ್ಲಿ ಇಡೀ ಆರ್ಯಭಟೀಯವನ್ನು ಟಿಪ್ಪಣಿಗಳೊಂದಿಗೆ ಅನುವಾದಿಸಿದರು. ಕೆಲವು ಓದುಗಳನ್ನು ಅವರು ಅನಿಶ್ಚಿತ ಎಂದು ಗುರುತಿಸಿದ್ದಾರೆ; ದುಂಡು ಆವರಣದಲ್ಲಿರುವ ಪದಗಳು ಅವರೇ ಸೇರಿಸಿದವು."
style_note:
  en: "Scholarly English; 'sine' means the half-chord in a circle of a given radius, not the modern ratio."
  kn: "ವಿದ್ವತ್ಪೂರ್ಣ ಇಂಗ್ಲಿಷ್; ಇಲ್ಲಿ 'sine' ಎಂದರೆ ನಿರ್ದಿಷ್ಟ ತ್ರಿಜ್ಯದ ವೃತ್ತದಲ್ಲಿನ ಅರ್ಧಜ್ಯಾ, ಇಂದಿನ ಅನುಪಾತವಲ್ಲ."
